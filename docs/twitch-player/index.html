<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=400,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>SOHR • Twitch Player</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#fff}
    #wrap{position:fixed;inset:0;display:grid;place-items:center;background:#000}
    iframe{display:block;width:100%;height:100%;min-width:400px;min-height:300px;border:0;background:#000}
    #status{position:absolute;inset:0;display:grid;place-items:center;color:#b9afc9;font-size:14px;text-align:center;padding:24px;box-sizing:border-box}
  </style>
</head>
<body>
  <div id="wrap">
    <div id="status">Загружаем Twitch…</div>
    <iframe id="player" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
  </div>
  <script>
    (() => {
      const id = (new URLSearchParams(location.search).get("video") || "").replace(/\D/g, "");
      const status = document.getElementById("status");
      const player = document.getElementById("player");
      if (!id) {
        status.textContent = "Не удалось определить Twitch Video ID.";
        player.remove();
        return;
      }
      player.src = "https://player.twitch.tv/?video=v" + encodeURIComponent(id) +
        "&parent=unknokable0.github.io&autoplay=false&muted=false";
      player.addEventListener("load", () => {
        setTimeout(() => { status.style.display = "none"; }, 350);
      });
    })();
  </script>
</body>
</html>
