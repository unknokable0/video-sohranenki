<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=400,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>SOHR • Twitch Player</title>
  <style>
    html,body,#player{margin:0;width:100%;height:100%;min-width:400px;min-height:300px;background:#000;overflow:hidden}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
  </style>
</head>
<body>
  <div id="player"></div>
  <script src="https://player.twitch.tv/js/embed/v1.js"></script>
  <script>
    (() => {
      const query = new URLSearchParams(location.search);
      const id = (query.get("video") || "").replace(/\D/g, "");
      const start = Math.max(0, parseInt(query.get("start") || "0", 10) || 0);
      let player = null;
      let ready = false;

      function safe(call, fallback) {
        try { return call(); } catch (_) { return fallback; }
      }

      function qualityScore(value) {
        const q = String(value || "").toLowerCase();
        if (q === "chunked") return 100000;
        if (q === "auto") return -1;
        const height = parseInt((q.match(/(\d{3,4})p/) || [])[1] || "0", 10);
        const fps = /60/.test(q) ? 60 : (/50/.test(q) ? 50 : 30);
        return height * 100 + fps;
      }

      function preferBestQuality() {
        if (!player || !ready) return;
        const qualities = Array.from(safe(() => player.getQualities(), []) || []).map(String);
        if (!qualities.length) return;
        const source = qualities.find(q => q.toLowerCase() === "chunked");
        const best = source || qualities
          .filter(q => q.toLowerCase() !== "auto")
          .sort((a, b) => qualityScore(b) - qualityScore(a))[0];
        if (best) safe(() => player.setQuality(best), null);
      }

      window.sohr = {
        play() { if (player && ready) safe(() => player.play(), null); },
        pause() { if (player && ready) safe(() => player.pause(), null); },
        seek(seconds) {
          if (player && ready) safe(() => player.seek(Math.max(0, Number(seconds) || 0)), null);
        },
        setQuality(quality) {
          if (player && ready && quality) safe(() => player.setQuality(String(quality)), null);
        },
        status() {
          if (!player || !ready) {
            return { ready:false, paused:true, current:0, duration:0, buffer:0, quality:"", qualities:[] };
          }
          const stats = safe(() => player.getPlaybackStats(), null);
          const qualities = safe(() => player.getQualities(), []) || [];
          return {
            ready:true,
            paused:!!safe(() => player.isPaused(), true),
            current:Number(safe(() => player.getCurrentTime(), 0)) || 0,
            duration:Number(safe(() => player.getDuration(), 0)) || 0,
            buffer:Number(stats && stats.bufferSize || 0) || 0,
            quality:String(safe(() => player.getQuality(), "") || ""),
            qualities:Array.from(qualities).map(String)
          };
        }
      };

      if (!id) return;

      player = new Twitch.Player("player", {
        width:"100%",
        height:"100%",
        video:id,
        parent:["unknokable0.github.io"],
        autoplay:false,
        muted:false,
        time:start > 0 ? (start + "s") : "0s"
      });

      player.addEventListener(Twitch.Player.READY, () => {
        ready = true;
        // Twitch VODs often begin in a conservative Auto rendition. Prefer
        // Source/Original immediately when the player exposes it; otherwise
        // select the highest explicit rendition. The user can still change
        // quality manually from SOHR afterwards.
        setTimeout(preferBestQuality, 180);
        setTimeout(preferBestQuality, 900);
        if (start > 0) {
          setTimeout(() => safe(() => player.seek(start), null), 250);
        }
      });
    })();
  </script>
</body>
</html>
