<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>SOHR • Twitch</title>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; color-scheme: dark; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0d0b12; color:#f6f2ff; }
    .card { width:min(92vw,420px); padding:28px; border-radius:24px; background:#17131f; box-shadow:0 18px 60px rgba(0,0,0,.35); text-align:center; }
    h1 { margin:0 0 8px; font-size:26px; }
    p { margin:0 0 18px; color:#b9afc9; line-height:1.45; }
    a { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 20px; border-radius:15px; background:#8b5cf6; color:#fff; text-decoration:none; font-weight:700; }
  </style>
</head>
<body>
  <main class="card">
    <h1>SOHR</h1>
    <p id="status">Проверяем вход Twitch…</p>
    <a id="open" href="sohr://twitch-auth">Открыть SOHR</a>
  </main>
  <script>
    (() => {
      const hash = window.location.hash || "";
      const query = window.location.search || "";
      const payload = hash || query;
      const target = "sohr://twitch-auth" + payload;
      const button = document.getElementById("open");
      const status = document.getElementById("status");
      button.href = target;
      if (!payload) {
        status.textContent = "Twitch не вернул данные авторизации. Вернись в SOHR и попробуй ещё раз.";
        return;
      }
      const params = new URLSearchParams(payload.replace(/^[#?]/, ""));
      if (params.get("error")) {
        status.textContent = "Вход отменён. Возвращаемся в SOHR…";
      } else {
        status.textContent = "Вход выполнен. Теперь Twitch доступен в SOHR.";
      }
      setTimeout(() => { window.location.href = target; }, 850);
    })();
  </script>
</body>
</html>
