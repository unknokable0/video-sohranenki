<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
  <meta name="robots" content="noindex,nofollow">
  <title>SOHR · Twitch</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b0b10;color:#f7f5ff}
    .card{width:min(92vw,420px);padding:30px 24px;border-radius:26px;background:#17131f;border:1px solid #2c2539;text-align:center}
    .logo{width:62px;height:62px;margin:0 auto 16px;border-radius:20px;display:grid;place-items:center;background:#7c3aed;font-size:29px;font-weight:900}
    h1{margin:0 0 8px;font-size:24px}
    p{margin:0 0 18px;color:#b9b1c7;line-height:1.45}
    a{display:flex;min-height:50px;align-items:center;justify-content:center;border-radius:16px;background:#7c3aed;color:#fff;text-decoration:none;font-weight:800}
    .small{margin-top:13px;font-size:12px;color:#81798d}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">S</div>
    <h1>Вход выполнен</h1>
    <p id="status">Возвращаемся в SOHR…</p>
    <a id="open" href="sohr://twitch-auth">Открыть SOHR</a>
    <div class="small">Если приложение не открылось автоматически, нажми кнопку.</div>
  </main>
  <script>
    (() => {
      const payload = location.hash || location.search || "";
      const target = "sohr://twitch-auth" + payload;
      const button = document.getElementById("open");
      const status = document.getElementById("status");
      button.href = target;

      if (!payload) {
        status.textContent = "Twitch не вернул данные входа. Вернись в SOHR и попробуй ещё раз.";
        return;
      }

      const params = new URLSearchParams(payload.replace(/^[#?]/, ""));
      if (params.get("error")) {
        status.textContent = "Вход Twitch отменён. Возвращаемся в SOHR…";
      } else if (params.get("access_token")) {
        status.textContent = "Twitch подключён. Открываем SOHR…";
      } else {
        status.textContent = "Получены данные Twitch. Открываем SOHR…";
      }

      const openApp = () => { window.location.href = target; };
      setTimeout(openApp, 180);
      setTimeout(openApp, 900);
    })();
  </script>
</body>
</html>
