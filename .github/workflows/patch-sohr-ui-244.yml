name: Patch SOHR update dialog and video tabs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-sohr-ui-244.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Apply UI patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_sohr.py
          python /tmp/patch_sohr.py
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-sohr-ui-244.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/app/src/main/java/com/unknokable/videosohranenki/MainActivity.kt native/app/src/main/java/com/unknokable/videosohranenki/ModernDialogs.kt .github/workflows/patch-sohr-ui-244.yml
          git commit -m 'Polish update dialog and video tabs'
          git push
