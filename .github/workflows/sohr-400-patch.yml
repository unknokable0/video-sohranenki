name: SOHR local playback compile fix
on:
  push:
    branches: [main]
    paths: [".github/workflows/sohr-400-patch.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix nullable stream prefetch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('native/app/src/main/java/com/unknokable/videosohranenki/MainActivity.kt')
          s = p.read_text()
          s = s.replace('        server.prefetch(item)\n', '        if (localFile == null) server?.prefetch(item)\n', 1)
          s = s.replace('        nextItem?.let { server.prefetch(it) }\n', '        nextItem?.takeIf { it.localPath == null }?.let { server?.prefetch(it) }\n', 1)
          p.write_text(s)
          PY
          git config user.name "sohr-dev-bot"
          git config user.email "actions@users.noreply.github.com"
          git add native/app/src/main/java/com/unknokable/videosohranenki/MainActivity.kt
          git diff --cached --check
          git commit -m "Fix local and Telegram player prefetch"
          git push