name: SOHR 5.0 UI stability pass
on:
  push:
    branches: [main]
    paths: [".github/workflows/sohr-400-patch.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix library transitions and navigation stability
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('native/app/src/main/java/com/unknokable/videosohranenki/MainActivity.kt')
          s = p.read_text()

          # Fix the screenshot bug: translationX was applied to the new section
          # but never animated back to zero, permanently shifting/clipping the page.
          old = '''                if (sectionCrossfade) {
                              val travel = dp(18).toFloat() * if (sectionDirection == 0) 1 else sectionDirection
                              content.alpha = 0f
                              content.translationX = travel
                              old.alpha = 1f
                              old.translationX = 0f
                              old.animate()
                                  .alpha(0f)
                                  .setDuration(120L)
                                  .setInterpolator(telegramInterpolator)
                                  .start()
                              content.animate()
                                  .alpha(1f)
                                  .setDuration(170L)
                                  .setInterpolator(telegramInterpolator)
                                  .withEndAction {
                                      old.alpha = 1f
                                      old.setLayerType(View.LAYER_TYPE_NONE, null)
                                      content.setLayerType(View.LAYER_TYPE_NONE, null)
                                      if (old.parent === host) host.removeView(old)
                                  }
                                  .start()
          '''
          new = '''                if (sectionCrossfade) {
                              val direction = if (sectionDirection == 0) 1 else sectionDirection
                              val travel = dp(22).toFloat() * direction
                              content.alpha = 0f
                              content.translationX = travel
                              old.alpha = 1f
                              old.translationX = 0f
                              old.animate()
                                  .alpha(0.12f)
                                  .translationX(-travel * 0.18f)
                                  .setDuration(150L)
                                  .setInterpolator(telegramInterpolator)
                                  .start()
                              content.animate()
                                  .alpha(1f)
                                  .translationX(0f)
                                  .setDuration(220L)
                                  .setInterpolator(telegramInterpolator)
                                  .withEndAction {
                                      old.animate().cancel()
                                      old.alpha = 1f
                                      old.translationX = 0f
                                      old.translationY = 0f
                                      content.alpha = 1f
                                      content.translationX = 0f
                                      content.translationY = 0f
                                      old.setLayerType(View.LAYER_TYPE_NONE, null)
                                      content.setLayerType(View.LAYER_TYPE_NONE, null)
                                      if (old.parent === host) host.removeView(old)
                                  }
                                  .start()
          '''
          if old not in s:
              raise SystemExit('section transition block not found')
          s = s.replace(old, new, 1)

          # If the user taps/swipes rapidly, never keep half-animated stale pages.
          marker = '''        val old = if (host.childCount > 0) host.getChildAt(host.childCount - 1) else null

                  val animateContent = settings.animations && old != null && old !== content
          '''
          replacement = '''        while (host.childCount > 1) {
                      val stale = host.getChildAt(0)
                      stale.animate().cancel()
                      stale.alpha = 1f
                      stale.translationX = 0f
                      stale.translationY = 0f
                      stale.setLayerType(View.LAYER_TYPE_NONE, null)
                      host.removeViewAt(0)
                  }
                  val old = if (host.childCount > 0) host.getChildAt(host.childCount - 1) else null
                  old?.animate()?.cancel()
                  old?.alpha = 1f
                  old?.translationX = 0f
                  old?.translationY = 0f
                  old?.scaleX = 1f
                  old?.scaleY = 1f

                  val animateContent = settings.animations && old != null && old !== content
          '''
          if marker not in s:
              raise SystemExit('host cleanup marker not found')
          s = s.replace(marker, replacement, 1)

          # Keep the section tabs' own swipe listener: the generic press installer
          # must not replace it later when the page is attached.
          s, count = re.subn(
              r'(isClickable=true; isFocusable=true\s*\n\s*)(var swipeStartX = 0f)',
              r'\1tag = "sohr_video_section_tab"\n                \2',
              s,
              count=1
          )
          if count != 1:
              raise SystemExit('video tab gesture marker not found')

          old_press = 'if (buttonLike && target !is SohrBottomNavView) {'
          new_press = 'if (buttonLike && target !is SohrBottomNavView && target.tag != "sohr_video_section_tab") {'
          if old_press not in s:
              raise SystemExit('press animation marker not found')
          s = s.replace(old_press, new_press, 1)

          # Remove dead legacy branch for section 0; only Collections and Watched exist now.
          dead_start = s.find('        if(videoSection==0){')
          if dead_start >= 0:
              dead_else = s.find('        } else if(visibleGroups.isEmpty()) {', dead_start)
              if dead_else < 0:
                  raise SystemExit('dead section end not found')
              tail_start = dead_else + len('        } else if(visibleGroups.isEmpty()) {')
              s = s[:dead_start] + '        if(visibleGroups.isEmpty()) {' + s[tail_start:]

          p.write_text(s)
          PY
          git config user.name "sohr-dev-bot"
          git config user.email "actions@users.noreply.github.com"
          git add native/app/src/main/java/com/unknokable/videosohranenki/MainActivity.kt
          git commit -m "SOHR 5.0: fix clipped library and harden transitions"
          git push
