name: Apply SOHR 4.0.0 patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sohr-400-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply neutral login and version
        shell: bash
        run: echo '' | base64 -d | python
      - name: Commit SOHR 4.0.0
        shell: bash
        run: |
          git config user.name "sohr-dev-bot"
          git config user.email "actions@users.noreply.github.com"
          git add native/app/src/main/java/com/unknokable/videosohranenki/MainActivity.kt native/app/build.gradle.kts
          git commit -m "SOHR 4.0.0 neutral phone login"
          git push
