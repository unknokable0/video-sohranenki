name: Fix SOHR gesture compiler
on:
  push:
    branches: [main]
    paths: [".github/workflows/sohr-400-patch.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix gesture declarations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('native/app/src/main/java/com/unknokable/videosohranenki/PlayerGestureOverlay.kt')
          s=p.read_text()
          s=s.replace('private val longPress = Runnable {','private val longPress: Runnable = Runnable {')
          s=s.replace('private val scaleDetector = ScaleGestureDetector(activity,','private val scaleDetector: ScaleGestureDetector = ScaleGestureDetector(activity,')
          p.write_text(s)
          PY
          git config user.name "sohr-dev-bot"
          git config user.email "actions@users.noreply.github.com"
          git add native/app/src/main/java/com/unknokable/videosohranenki/PlayerGestureOverlay.kt
          git commit -m "Fix gesture type inference"
          git push
