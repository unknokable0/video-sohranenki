name: SOHR fullscreen and seek stability fix
on:
  push:
    branches: [main]
    paths: [".github/workflows/sohr-400-patch.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch fullscreen and Telegram random seek
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('native/app/src/main/java/com/unknokable/videosohranenki/PlayerScreen.kt')
          s = p.read_text()
          old = "\n".join([
              "        val params = playerCard.layoutParams as LinearLayout.LayoutParams",
              "        if (enabled) {",
              "            params.height = 0",
              "            params.weight = 1f",
              "            params.marginStart = 0",
              "            params.marginEnd = 0",
              "            playerCard.background = rounded(\"#000000\", 0)",
              "        } else {",
              "            val width = activity.resources.displayMetrics.widthPixels",
              "            params.height = (width * 9f / 16f).toInt()",
              "            params.weight = 0f",
              "            params.marginStart = dp(12)",
              "            params.marginEnd = dp(12)",
              "            playerCard.background = rounded(\"#000000\", 18)",
              "        }",
              "        playerCard.layoutParams = params",
              "        playerCard.requestLayout()",
          ])
          new = "\n".join([
              "        val params = playerCard.layoutParams as? LinearLayout.LayoutParams",
              "        if (params != null) {",
              "            if (enabled) {",
              "                params.height = 0",
              "                params.weight = 1f",
              "                params.marginStart = 0",
              "                params.marginEnd = 0",
              "                playerCard.background = rounded(\"#000000\", 0)",
              "            } else {",
              "                val width = activity.resources.displayMetrics.widthPixels",
              "                params.height = (width * 9f / 16f).toInt()",
              "                params.weight = 0f",
              "                params.marginStart = dp(12)",
              "                params.marginEnd = dp(12)",
              "                playerCard.background = rounded(\"#000000\", 18)",
              "            }",
              "            playerCard.layoutParams = params",
              "            playerCard.requestLayout()",
              "        }",
          ])
          if old not in s: raise SystemExit('PlayerScreen fullscreen block not found')
          s = s.replace(old, new, 1)
          old_seek = "\n".join([
              "                    if (!canceled) {",
              "                        player.seekTo(positionMs)",
              "                        currentTime.text = formatMs(positionMs)",
              "                    }",
          ])
          new_seek = "\n".join([
              "                    if (!canceled) {",
              "                        previewRequestId++",
              "                        previewJob?.cancel()",
              "                        previewJob = null",
              "                        player.seekTo(positionMs)",
              "                        currentTime.text = formatMs(positionMs)",
              "                    }",
          ])
          if old_seek not in s: raise SystemExit('PlayerScreen scrub stop block not found')
          s = s.replace(old_seek, new_seek, 1)
          p.write_text(s)

          p = Path('native/app/src/main/java/com/unknokable/videosohranenki/MainActivity.kt')
          s = p.read_text()
          s = s.replace('                requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE\n', '                runCatching { requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE }\n', 1)
          s = s.replace('            requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED\n', '            runCatching { requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED }\n', 1)
          p.write_text(s)

          p = Path('native/app/src/main/java/com/unknokable/videosohranenki/TelegramStreamServer.kt')
          s = p.read_text()
          marker = "\n".join([
              "        val result = runBlocking {",
              "            client.send(TdApi.DownloadFile(fileId, 32, windowStart, windowLimit, true))",
              "        }",
              "        applyLocalRange(result.local)",
          ])
          replacement = "\n".join([
              "        val result = runBlocking {",
              "            runCatching { client.send(TdApi.CancelDownloadFile(fileId, false)) }",
              "            client.send(TdApi.DownloadFile(fileId, 32, windowStart, windowLimit, true))",
              "        }",
              "        applyLocalRange(result.local)",
          ])
          if marker not in s: raise SystemExit('Telegram playback range block not found')
          s = s.replace(marker, replacement, 1)
          retry = "\n".join([
              "            val retry = runBlocking {",
              "                client.send(TdApi.DownloadFile(fileId, 32, offset, retryLimit, true))",
              "            }",
          ])
          retry_new = "\n".join([
              "            val retry = runBlocking {",
              "                runCatching { client.send(TdApi.CancelDownloadFile(fileId, false)) }",
              "                client.send(TdApi.DownloadFile(fileId, 32, offset, retryLimit, true))",
              "            }",
          ])
          if retry not in s: raise SystemExit('Telegram playback retry block not found')
          s = s.replace(retry, retry_new, 1)
          p.write_text(s)
          PY

          git config user.name "sohr-dev-bot"
          git config user.email "actions@users.noreply.github.com"
          git add native/app/src/main/java/com/unknokable/videosohranenki/PlayerScreen.kt native/app/src/main/java/com/unknokable/videosohranenki/MainActivity.kt native/app/src/main/java/com/unknokable/videosohranenki/TelegramStreamServer.kt
          git diff --cached --check
          git commit -m "Fix fullscreen crash and Telegram random seeking"
          git push