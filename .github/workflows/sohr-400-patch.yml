name: SOHR smooth player transitions
on:
  push:
    branches: [main]
    paths: [".github/workflows/sohr-400-patch.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove player transition jank
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          player = Path('native/app/src/main/java/com/unknokable/videosohranenki/PlayerScreen.kt')
          s = player.read_text()
          old = '''        playerView = PlayerView(activity).apply {
              useController = false
              resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FIT
              setBackgroundColor(Color.BLACK)
          }
'''
          new = '''        playerView = activity.layoutInflater.inflate(
              R.layout.view_sohr_player,
              playerCard,
              false
          ) as PlayerView
          playerView.apply {
              useController = false
              resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FIT
              setBackgroundColor(Color.BLACK)
          }
'''
          if old not in s:
              raise SystemExit('PlayerView construction block not found')
          s = s.replace(old, new, 1)
          player.write_text(s)

          layout = Path('native/app/src/main/res/layout/view_sohr_player.xml')
          layout.parent.mkdir(parents=True, exist_ok=True)
          layout.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <androidx.media3.ui.PlayerView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000"
              app:resize_mode="fit"
              app:surface_type="texture_view"
              app:use_controller="false" />
          ''')

          main = Path('native/app/src/main/java/com/unknokable/videosohranenki/MainActivity.kt')
          m = main.read_text()
          old_var = '    private var suppressNextRootAnimation = false\n'
          new_var = old_var + '    private var suppressNextContentAnimation = false\n'
          if 'private var suppressNextContentAnimation' not in m:
              if old_var not in m:
                  raise SystemExit('root animation state field not found')
              m = m.replace(old_var, new_var, 1)

          old_back = '''                    pendingRootSlide = -1
                    val day = currentDay
                    if (day != null && day.videos.isNotEmpty()) showDayCollection(day) else { currentDay = null; showFeed(currentVideos) }
'''
          new_back = '''                    pendingRootSlide = -1
                    // The primary collection shell is rebuilt underneath the player.
                    // Do not animate that hidden rebuild as well as the root pop: two
                    // simultaneous transitions make thumbnails appear to jump.
                    suppressNextContentAnimation = true
                    val day = currentDay
                    if (day != null && day.videos.isNotEmpty()) showDayCollection(day) else { currentDay = null; showFeed(currentVideos) }
'''
          if old_back not in m:
              raise SystemExit('player back block not found')
          m = m.replace(old_back, new_back, 1)

          old_anim = '        val animateContent = settings.animations && old != null && old !== content\n'
          new_anim = '''        val skipContentAnimation = suppressNextContentAnimation
        suppressNextContentAnimation = false
        val animateContent = settings.animations && !skipContentAnimation && old != null && old !== content
'''
          if old_anim not in m:
              raise SystemExit('content animation gate not found')
          m = m.replace(old_anim, new_anim, 1)

          start = m.find('    private fun replaceRoot(view: View) {')
          end = m.find('    private fun installPressAnimations(view: View) {', start)
          if start < 0 or end < 0:
              raise SystemExit('replaceRoot block not found')
          block = m[start:end]
          # TextureView makes the video part of normal view composition, so the
          # whole player can move as one layer instead of the SurfaceView lagging.
          block = block.replace('.translationX(dp(48).toFloat())\n                .setDuration(150L)', '.translationX(dp(36).toFloat())\n                .setDuration(210L)')
          block = block.replace('view.translationX = dp(48).toFloat()\n            view.animate()', 'view.translationX = dp(36).toFloat()\n            view.animate()')
          block = block.replace('.translationX(0f)\n                .setDuration(150L)', '.translationX(0f)\n                .setDuration(210L)')
          m = m[:start] + block + m[end:]
          main.write_text(m)
          PY
          git config user.name "sohr-dev-bot"
          git config user.email "actions@users.noreply.github.com"
          git add native/app/src/main/java/com/unknokable/videosohranenki/PlayerScreen.kt native/app/src/main/java/com/unknokable/videosohranenki/MainActivity.kt native/app/src/main/res/layout/view_sohr_player.xml
          git diff --cached --check
          git commit -m "SOHR: smooth video open and back transitions"
          git push