name: SOHR smart sync previews stats share
on:
  push:
    branches: [main]
    paths: [".github/workflows/sohr-400-patch.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply SOHR feature pack
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          base = Path('native/app/src/main/java/com/unknokable/videosohranenki')
          p = base / 'VideoItem.kt'
          s = p.read_text()
          if 'val localPath:' not in s:
              s = s.replace('    val thumbnailPath: String? = null\n', '    val thumbnailPath: String? = null,\n    val localPath: String? = null\n')
          p.write_text(s)
          (base / 'SohrVideoCache.kt').write_bytes(base64.b64decode(''))
          (base / 'LocalFileMediaDataSource.kt').write_bytes(base64.b64decode(''))
          p = base / 'MainActivity.kt'
          s = p.read_text()
          if 'import android.net.Uri' not in s:
              s = s.replace('import android.os.Bundle\n', 'import android.os.Bundle\nimport android.net.Uri\n')
          if 'private lateinit var videoCache:' not in s:
              s = s.replace('    private lateinit var updateManager: SohrUpdateManager\n', '    private lateinit var updateManager: SohrUpdateManager\n    private lateinit var videoCache: SohrVideoCache\n    private var telegramReady = false\n')
          if 'videoCache = SohrVideoCache(this)' not in s:
              s = s.replace('        updateManager = SohrUpdateManager(this)\n', '        updateManager = SohrUpdateManager(this)\n        videoCache = SohrVideoCache(this)\n')
          if '        handleSharedIntent(intent)\n' not in s:
              s = s.replace('        setContentView(root)\n', '        setContentView(root)\n        handleSharedIntent(intent)\n', 1)
          if 'override fun onNewIntent(intent: Intent)' not in s:
              s = s.replace('    override fun onResume() {\n', '    override fun onNewIntent(intent: Intent) {\n        super.onNewIntent(intent)\n        setIntent(intent)\n        handleSharedIntent(intent)\n    }\n\n    override fun onResume() {\n', 1)
          s = s.replace('                            loadVideos()\n', '                            loadVideos(inPlace = true)\n', 1)
          old_ready = '            is TdApi.AuthorizationStateReady -> {\n                settings.authPhone = null\n                ensureStreamServer()\n                cleanupStorage()\n                loadVideos()\n            }\n'
          new_ready = '            is TdApi.AuthorizationStateReady -> {\n                settings.authPhone = null\n                telegramReady = true\n                ensureStreamServer()\n                cleanupStorage()\n                val zone = ZoneId.systemDefault()\n                val cutoff = LocalDate.now(zone).minusDays(6).atStartOfDay(zone).toEpochSecond()\n                val cached = videoCache.load().filter { it.localPath != null || it.date.toLong() >= cutoff }\n                    .sortedWith(compareBy<VideoItem> { it.date }.thenBy { it.messageId })\n                if (cached.isNotEmpty()) {\n                    currentVideos = cached\n                    updateStatsSnapshot(cached)\n                    runOnUiThread { suppressNextRootAnimation = true; showFeed(cached) }\n                }\n                loadVideos(inPlace = cached.isNotEmpty())\n            }\n'
          if old_ready not in s:
              raise SystemExit('AuthorizationStateReady block not found')
          s = s.replace(old_ready, new_ready, 1)
          old_collected = '                val collected = linkedMapOf<Long, VideoItem>()\n'
          if old_collected not in s:
              raise SystemExit('collected marker not found')
          s = s.replace(old_collected, old_collected + '                videoCache.load().asSequence().filter { it.localPath != null }.forEach { collected[it.messageId] = it }\n', 1)
          s = s.replace('                    .filter { it.date.toLong() >= cutoffEpoch }\n', '                    .filter { it.localPath != null || it.date.toLong() >= cutoffEpoch }\n', 1)
          old_prepared = '                val preparedVideos = if (settings.previews) {\n                    videos.chunked(6).flatMap { batch ->\n'
          new_prepared = '                val cachedById = videoCache.load().associateBy { it.messageId }\n                val videosWithCachedThumbs = videos.map { item ->\n                    val cached = cachedById[item.messageId]\n                    if (item.thumbnailPath.isNullOrBlank() && cached?.thumbnailPath?.let { File(it).exists() } == true) item.copy(thumbnailPath = cached.thumbnailPath) else item\n                }\n                val preparedVideos = if (settings.previews) {\n                    videosWithCachedThumbs.chunked(6).flatMap { batch ->\n'
          if old_prepared not in s:
              raise SystemExit('preparedVideos marker not found')
          s = s.replace(old_prepared, new_prepared, 1)
          s = s.replace('                    videos.map { it.copy(thumbnailPath = null) }\n', '                    videosWithCachedThumbs\n', 1)
          old_assign = '                    currentVideos = preparedVideos\n'
          if old_assign not in s:
              raise SystemExit('currentVideos assignment not found')
          s = s.replace(old_assign, old_assign + '                    videoCache.save(preparedVideos)\n                    updateStatsSnapshot(preparedVideos)\n', 1)
          attach = '    private suspend fun attachThumbnail(item: VideoItem): VideoItem {\n'
          if attach not in s:
              raise SystemExit('attachThumbnail not found')
          if 'item.thumbnailPath?.takeIf { File(it).exists() }' not in s:
              s = s.replace(attach, attach + '        item.thumbnailPath?.takeIf { File(it).exists() }?.let { return item }\n', 1)
          watched = '    private fun watchedVideoIds(): Set<String> =\n'
          if watched not in s:
              raise SystemExit('watched marker not found')
          if 'private fun updateStatsSnapshot' not in s:
              s = s.replace(watched, base64.b64decode('').decode() + watched, 1)
          s = s.replace('        if (added) prefs.edit().putStringSet("ids", ids).apply()\n        return added\n', '        if (added) { prefs.edit().putStringSet("ids", ids).apply(); updateStatsSnapshot(currentVideos) }\n        return added\n', 1)
          s = s.replace('        if (removed) prefs.edit().putStringSet("ids", ids).apply()\n        return removed\n', '        if (removed) { prefs.edit().putStringSet("ids", ids).apply(); updateStatsSnapshot(currentVideos) }\n        return removed\n', 1)
          old_open = '    private fun openPlayer(item: VideoItem, startSeconds: Int = 0) {\n        val server = streamServer\n        if (server == null) {\n            Toast.makeText(this, "Видеопоток ещё не готов", Toast.LENGTH_SHORT).show()\n            return\n        }\n'
          new_open = '    private fun openPlayer(item: VideoItem, startSeconds: Int = 0) {\n        val localFile = item.localPath?.let(::File)?.takeIf { it.exists() }\n        val server = streamServer\n        if (localFile == null && server == null) return\n'
          if old_open not in s:
              raise SystemExit('openPlayer header not found')
          s = s.replace(old_open, new_open, 1)
          old_media = '            mediaUrl = server.url(item),\n            previewDataSourceFactory = { server.mediaDataSource(item) },\n'
          new_media = '            mediaUrl = localFile?.let { Uri.fromFile(it).toString() } ?: server!!.url(item),\n            previewDataSourceFactory = { localFile?.let { LocalFileMediaDataSource(it) } ?: server!!.mediaDataSource(item) },\n'
          if old_media not in s:
              raise SystemExit('media block not found')
          s = s.replace(old_media, new_media, 1)
          p.write_text(s)
          p = base / 'SettingsScreen.kt'
          s = p.read_text()
          if 'root.addView(statisticsCard())' not in s:
              s = s.replace('        root.addView(subtitle)\n\n', '        root.addView(subtitle)\n\n        root.addView(statisticsCard())\n\n', 1)
          if 'private fun statisticsCard()' not in s:
              marker = '    private fun languageSelector(): View {\n'
              if marker not in s:
                  raise SystemExit('settings marker not found')
              s = s.replace(marker, base64.b64decode('').decode() + marker, 1)
          p.write_text(s)
          p = Path('native/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.intent.action.SEND' not in s:
              launcher = '            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n'
              share = launcher + '            <intent-filter>\n                <action android:name="android.intent.action.SEND" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <data android:mimeType="video/*" />\n            </intent-filter>\n'
              if launcher not in s:
                  raise SystemExit('manifest launcher marker not found')
              s = s.replace(launcher, share, 1)
          p.write_text(s)
          PY
          git config user.name "sohr-dev-bot"
          git config user.email "actions@users.noreply.github.com"
          git add native/app/src/main
          git diff --cached --check
          git commit -m "SOHR: smart sync previews stats and Share import"
          git push