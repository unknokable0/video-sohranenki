name: Apply SOHR player step 1 fixes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sohr-400-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply player step 1 fixes
        shell: bash
        run: echo '' | base64 -d | gzip -d | python
      - name: Commit player step 1
        shell: bash
        run: |
          git config user.name "sohr-dev-bot"
          git config user.email "actions@users.noreply.github.com"
          git add native/app/src/main/java/com/unknokable/videosohranenki/PlayerScreen.kt
          git commit -m "SOHR player step 1: fix duration layout and details"
          git push
