name: SOHR fast playback optimization
on:
  push:
    branches: [main]
    paths: [".github/workflows/sohr-400-patch.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize Telegram streaming and seeking
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('native/app/src/main/java/com/unknokable/videosohranenki/TelegramStreamServer.kt')
          s = p.read_text()
          s = s.replace('            runCatching { client.send(TdApi.CancelDownloadFile(fileId, false)) }\n', '')
          s = s.replace('    private val firstWindow = 8L * 1024L * 1024L\n', '    private val firstWindow = 2L * 1024L * 1024L\n')
          s = s.replace('    private val steadyWindow = 32L * 1024L * 1024L\n', '    private val steadyWindow = 12L * 1024L * 1024L\n')
          s = s.replace('    private val prefetchThreshold = 8L * 1024L * 1024L\n', '    private val prefetchThreshold = 4L * 1024L * 1024L\n')
          s = s.replace('    private val chunkSize = 6L * 1024L * 1024L\n', '    private val chunkSize = 2L * 1024L * 1024L\n')
          p.write_text(s)

          p = Path('native/app/src/main/java/com/unknokable/videosohranenki/PlayerScreen.kt')
          s = p.read_text()
          s = s.replace('''            .setBufferDurationsMs(\n                25_000,\n                120_000,\n                650,\n                1_500\n            )''','''            .setBufferDurationsMs(\n                12_000,\n                45_000,\n                500,\n                1_200\n            )''')

          pattern = re.compile(r'''    private fun requestPreview\(positionMs: Long\) \{.*?\n    \}\n\n    private fun ensurePreviewRetriever\(\)''', re.S)
          replacement = '''    private fun requestPreview(positionMs: Long) {\n        if (positionMs < 0) return\n        val bucket = (positionMs / 2_000L) * 2_000L\n        previewCache[bucket]?.takeIf { !it.isRecycled }?.let { cached ->\n            previewImage.setImageBitmap(cached)\n            previewBitmap = cached\n        }\n    }\n\n    private fun ensurePreviewRetriever()'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('requestPreview block not found')

          old = '''            onScrub = { positionMs, finished ->\n                dragging = !finished\n                if (!finished) {\n                    player.setScrubbingModeEnabled(true)\n                    player.seekTo(positionMs)\n                    showPreview()\n                    updatePreviewUi(positionMs, (positionMs.toFloat()/resolvedDurationMs().coerceAtLeast(1L)).coerceIn(0f,1f))\n                    requestPreview(positionMs)\n                } else { player.setScrubbingModeEnabled(false); hidePreview() }\n            },'''
          new = '''            onScrub = { positionMs, finished ->\n                dragging = !finished\n                if (!finished) {\n                    player.setScrubbingModeEnabled(true)\n                    showPreview()\n                    updatePreviewUi(positionMs, (positionMs.toFloat()/resolvedDurationMs().coerceAtLeast(1L)).coerceIn(0f,1f))\n                    requestPreview(positionMs)\n                } else {\n                    previewRequestId++\n                    previewJob?.cancel()\n                    previewJob = null\n                    player.setScrubbingModeEnabled(false)\n                    player.seekTo(positionMs)\n                    hidePreview()\n                }\n            },'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name "sohr-dev-bot"
          git config user.email "actions@users.noreply.github.com"
          git add native/app/src/main/java/com/unknokable/videosohranenki/TelegramStreamServer.kt native/app/src/main/java/com/unknokable/videosohranenki/PlayerScreen.kt
          git diff --cached --check
          git commit -m "Optimize Telegram video startup buffering and seeking"
          git push
          # trigger marker 2026-09-20