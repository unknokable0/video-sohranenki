name: Apply SOHR 3.0.10 patch

on:
  push:
    paths:
      - '.github/workflows/sohr-310-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/apply_sohr_310.py
      - name: Commit patched app
        run: |
          rm -f tools/apply_sohr_310.py .github/workflows/sohr-310-patch.yml
          git config user.name "sohr-dev-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "SOHR 3.0.10 player UX and performance polish"
          git push origin HEAD:main
