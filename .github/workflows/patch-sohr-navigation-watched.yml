name: Patch SOHR navigation watched UX
on:
  push:
    paths:
      - .github/workflows/patch-sohr-navigation-watched.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          sed -i "s/row.addView(watchedButton,LinearLayout.LayoutParams(0,dp(44),1f))/row.addView(watchedButton,LinearLayout.LayoutParams(0,dp(42),1f).apply{marginEnd=dp(5)})/" .github/patch_sohr_navigation.py
          sed -i "s/↩  Вернуть в сборники/↩  Вернуть/" .github/patch_sohr_navigation.py
          python3 .github/patch_sohr_navigation.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/app/src/main/java/com/unknokable/videosohranenki/MainActivity.kt native/app/src/main/java/com/unknokable/videosohranenki/PlayerScreen.kt
          git rm .github/workflows/patch-sohr-navigation-watched.yml .github/patch_sohr_navigation.py
          git commit -m "Polish navigation swipes and watched state"
          git push
