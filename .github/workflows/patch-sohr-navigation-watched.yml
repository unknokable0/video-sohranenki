name: Patch SOHR navigation and watched UX
on:
  push:
    paths:
      - '.github/workflows/patch-sohr-navigation-watched.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply navigation and watched UX patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main_path = Path('native/app/src/main/java/com/unknokable/videosohranenki/MainActivity.kt')
          player_path = Path('native/app/src/main/java/com/unknokable/videosohranenki/PlayerScreen.kt')
          main = main_path.read_text()
          player = player_path.read_text()

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected block: {label}')
              return text.replace(old, new, 1)

          # Keep the outgoing player alive until the return transition has rendered.
          old = '''                if (isPlayerScreen) {
                    playerScreen?.destroy()
                    playerScreen = null
                    isPlayerScreen = false
                    pendingRootSlide = -1
                    val day = currentDay
                    if (day != null && day.videos.isNotEmpty()) showDayCollection(day) else { currentDay = null; showFeed(currentVideos) }
                    return
                }'''
          new = '''                if (isPlayerScreen) {
                    val outgoingPlayer = playerScreen
                    playerScreen = null
                    isPlayerScreen = false
                    pendingRootSlide = -1
                    val day = currentDay
                    if (day != null && day.videos.isNotEmpty()) showDayCollection(day) else { currentDay = null; showFeed(currentVideos) }
                    // Releasing ExoPlayer before the incoming screen is drawn causes a visible black/jump frame.
                    root.postDelayed({ outgoingPlayer?.destroy() }, if (settings.animations) 280L else 0L)
                    return
                }'''
          main = must_replace(main, old, new, 'smooth player back')

          # Make all in-app back routes use the same direction instead of an abrupt content swap.
          for flag in ('isSettingsScreen', 'isAccountScreen', 'isStreakScreen'):
              old = f'''                if ({flag}) {{\n                    {flag} = false\n                    showFeed(currentVideos)\n                    return\n                }}'''
              new = f'''                if ({flag}) {{\n                    {flag} = false\n                    pendingRootSlide = -1\n                    showFeed(currentVideos)\n                    return\n                }}'''
              main = must_replace(main, old, new, f'back animation {flag}')
          main = must_replace(main,
              '''                if (currentDay != null) {
                    currentDay = null
                    showFeed(currentVideos)
                    return
                }''',
              '''                if (currentDay != null) {
                    currentDay = null
                    pendingRootSlide = -1
                    showFeed(currentVideos)
                    return
                }''',
              'collection back animation')

          # Watched state must be reversible and idempotent.
          old = '''    private fun markVideoWatched(messageId: Long) {
        val prefs = getSharedPreferences("sohr_watched", MODE_PRIVATE)
        val ids = prefs.getStringSet("ids", emptySet())?.toMutableSet() ?: mutableSetOf()
        ids.add(messageId.toString())
        prefs.edit().putStringSet("ids", ids).apply()
    }
'''
          new = '''    private fun markVideoWatched(messageId: Long): Boolean {
        val prefs = getSharedPreferences("sohr_watched", MODE_PRIVATE)
        val ids = prefs.getStringSet("ids", emptySet())?.toMutableSet() ?: mutableSetOf()
        val added = ids.add(messageId.toString())
        if (added) prefs.edit().putStringSet("ids", ids).apply()
        return added
    }

    private fun unmarkVideoWatched(messageId: Long): Boolean {
        val prefs = getSharedPreferences("sohr_watched", MODE_PRIVATE)
        val ids = prefs.getStringSet("ids", emptySet())?.toMutableSet() ?: mutableSetOf()
        val removed = ids.remove(messageId.toString())
        if (removed) prefs.edit().putStringSet("ids", ids).apply()
        return removed
    }

    private fun switchVideoSection(section: Int) {
        if (section !in 1..2 || videoSection == section) return
        pendingVideoSectionCrossfade = true
        pendingVideoSectionDirection = if (section > videoSection) 1 else -1
        pendingRootSlide = 0
        videoSection = section
        showFeed(currentVideos)
    }
'''
          main = must_replace(main, old, new, 'watched persistence')

          main = must_replace(main,
              '    private var pendingVideoSectionCrossfade = false\n',
              '    private var pendingVideoSectionCrossfade = false\n    private var pendingVideoSectionDirection = 0\n',
              'section direction state')

          # Tab click and swipe behavior. Swipe is deliberately thresholded so vertical scrolling/clicks are unaffected.
          old = '''                setOnClickListener {
                    if(videoSection==section) return@setOnClickListener
                    animatePress(this)
                    pendingVideoSectionCrossfade=true
                    pendingRootSlide=0
                    videoSection=section
                    showFeed(currentVideos)
                }
            }
            tabs.addView(tab,LinearLayout.LayoutParams(0,dp(40),1f).apply { if(position>0) marginStart=dp(3) })
        }
        header.addView(tabs,LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,dp(46)))'''
          new = '''                var swipeStartX = 0f
                var swipeStartY = 0f
                setOnTouchListener { _, event ->
                    when (event.actionMasked) {
                        MotionEvent.ACTION_DOWN -> { swipeStartX = event.x; swipeStartY = event.y; false }
                        MotionEvent.ACTION_UP -> {
                            val dx = event.x - swipeStartX
                            val dy = event.y - swipeStartY
                            if (kotlin.math.abs(dx) >= dp(46) && kotlin.math.abs(dx) > kotlin.math.abs(dy) * 1.25f) {
                                switchVideoSection(if (dx < 0f) 2 else 1)
                                true
                            } else false
                        }
                        MotionEvent.ACTION_CANCEL -> false
                        else -> false
                    }
                }
                setOnClickListener {
                    if(videoSection==section) return@setOnClickListener
                    animatePress(this)
                    switchVideoSection(section)
                }
            }
            tabs.addView(tab,LinearLayout.LayoutParams(0,dp(40),1f).apply { if(position>0) marginStart=dp(3) })
        }
        header.addView(tabs,LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,dp(46)))'''
          main = must_replace(main, old, new, 'tabs click/swipe')

          # Direction-aware tab transition: tiny horizontal travel + fade, not a full-screen jump.
          old = '''        val sectionCrossfade = pendingVideoSectionCrossfade
        pendingVideoSectionCrossfade = false
        content.alpha = 1f'''
          new = '''        val sectionCrossfade = pendingVideoSectionCrossfade
        val sectionDirection = pendingVideoSectionDirection
        pendingVideoSectionCrossfade = false
        pendingVideoSectionDirection = 0
        content.alpha = 1f'''
          main = must_replace(main, old, new, 'capture section direction')
          main = must_replace(main,
              '''                if (sectionCrossfade) {
                    content.alpha = 0f
                    content.translationX = 0f
                    old.alpha = 1f
                    old.translationX = 0f''',
              '''                if (sectionCrossfade) {
                    val travel = dp(18).toFloat() * if (sectionDirection == 0) 1 else sectionDirection
                    content.alpha = 0f
                    content.translationX = travel
                    old.alpha = 1f
                    old.translationX = 0f''',
              'directional section transition')

          # Player callback now supports both marking and restoring.
          old = '''            isWatched = isVideoWatched(item.messageId),
            onMarkWatched = { watched ->
                markVideoWatched(watched.messageId)
                if (videoSection != 2) currentDay = currentDay?.copy(videos = currentDay?.videos?.filterNot { it.messageId == watched.messageId } ?: emptyList())
            },'''
          new = '''            isWatched = isVideoWatched(item.messageId),
            onWatchedChange = { watched, shouldBeWatched ->
                if (shouldBeWatched) markVideoWatched(watched.messageId) else unmarkVideoWatched(watched.messageId)
                val noLongerBelongsToOpenSection = (videoSection == 1 && shouldBeWatched) || (videoSection == 2 && !shouldBeWatched)
                if (noLongerBelongsToOpenSection) {
                    currentDay = currentDay?.copy(videos = currentDay?.videos?.filterNot { it.messageId == watched.messageId } ?: emptyList())
                }
            },'''
          main = must_replace(main, old, new, 'player watched callback')

          # Player watched UX: repeated add gives clear feedback; watched videos can be restored with a dedicated action.
          player = must_replace(player,
              '    private val onMarkWatched: ((VideoItem) -> Unit)? = null,\n',
              '    private val onWatchedChange: ((VideoItem, Boolean) -> Unit)? = null,\n',
              'player callback signature')

          pattern = re.compile(r'''        var watched=isWatched\n        lateinit var watchedButton:TextView\n        watchedButton=actionPill\("✓  Просмотрено"\) \{\n            if\(watched\) return@actionPill\n            ModernDialogs\.showConfirm\(activity,palette,"Отметить просмотренным\?","Видео переместится в раздел «Просмотренное» и исчезнет из обычных сборников\.","Да, просмотрено"\) \{\n                watched=true;onMarkWatched\?\.invoke\(item\);watchedButton\.alpha=\.72f\n                watchedButton\.animate\(\)\.cancel\(\);watchedButton\.scaleX=\.96f;watchedButton\.scaleY=\.96f;watchedButton\.animate\(\)\.scaleX\(1f\)\.scaleY\(1f\)\.setDuration\(if\(settings\.animations\)180L else 0L\)\.start\(\)\n            \}\n        \}\n        if\(watched\) watchedButton\.alpha=\.72f''')
          replacement = '''        var watched=isWatched
        lateinit var watchedButton:TextView
        lateinit var restoreButton:TextView
        fun syncWatchedActions() {
            watchedButton.alpha = if (watched) .72f else 1f
            restoreButton.visibility = if (watched) View.VISIBLE else View.GONE
            restoreButton.alpha = if (watched) 1f else 0f
        }
        watchedButton=actionPill("✓  Просмотрено") {
            if(watched) {
                Toast.makeText(activity,"Видео уже добавлено в просмотренное",Toast.LENGTH_SHORT).show()
                watchedButton.animate().cancel();watchedButton.animate().scaleX(1.03f).scaleY(1.03f).setDuration(if(settings.animations)90L else 0L).withEndAction{watchedButton.animate().scaleX(1f).scaleY(1f).setDuration(if(settings.animations)110L else 0L).start()}.start()
                return@actionPill
            }
            ModernDialogs.showConfirm(activity,palette,"Отметить просмотренным?","Видео переместится в раздел «Просмотренное» и исчезнет из обычных сборников.","Да, просмотрено") {
                watched=true;onWatchedChange?.invoke(item,true);syncWatchedActions()
                watchedButton.animate().cancel();watchedButton.scaleX=.96f;watchedButton.scaleY=.96f;watchedButton.animate().scaleX(1f).scaleY(1f).setDuration(if(settings.animations)180L else 0L).start()
            }
        }
        restoreButton=actionPill("↩  Вернуть в сборники") {
            if(!watched) return@actionPill
            ModernDialogs.showConfirm(activity,palette,"Вернуть в сборники?","Видео исчезнет из «Просмотренного» и снова появится в обычном сборнике.","Вернуть") {
                watched=false;onWatchedChange?.invoke(item,false);syncWatchedActions()
                Toast.makeText(activity,"Видео возвращено в сборники",Toast.LENGTH_SHORT).show()
            }
        }
        syncWatchedActions()'''
          player, count = pattern.subn(replacement, player, count=1)
          if count != 1:
              raise SystemExit('Missing expected block: player watched actions')

          # Put restore action next to the watched/share controls without changing the existing visual language.
          old = '''        val shareButton=actionPill("↗  Поделиться") { val send=Intent(Intent.ACTION_SEND).apply{type="text/plain";putExtra(Intent.EXTRA_SUBJECT,cleanTitle(item.title));putExtra(Intent.EXTRA_TEXT,"${cleanTitle(item.title)} • SOHR")};runCatching{activity.startActivity(Intent.createChooser(send,"Поделиться видео"))} }'''
          new = '''        val shareButton=actionPill("↗  Поделиться") { val send=Intent(Intent.ACTION_SEND).apply{type="text/plain";putExtra(Intent.EXTRA_SUBJECT,cleanTitle(item.title));putExtra(Intent.EXTRA_TEXT,"${cleanTitle(item.title)} • SOHR")};runCatching{activity.startActivity(Intent.createChooser(send,"Поделиться видео"))} }'''
          # restoreButton is added wherever watchedButton is added below.
          player = must_replace(player, old, new, 'share anchor')
          player = player.replace(
              'row.addView(watchedButton,LinearLayout.LayoutParams(0,dp(44),1f))',
              'row.addView(watchedButton,LinearLayout.LayoutParams(0,dp(44),1f))\n        row.addView(restoreButton,LinearLayout.LayoutParams(0,dp(44),1f).apply { marginStart=dp(8) })',
              1
          )
          if 'row.addView(restoreButton' not in player:
              raise SystemExit('Missing expected block: add restore button')

          main_path.write_text(main)
          player_path.write_text(player)
          PY
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/app/src/main/java/com/unknokable/videosohranenki/MainActivity.kt native/app/src/main/java/com/unknokable/videosohranenki/PlayerScreen.kt
          git rm .github/workflows/patch-sohr-navigation-watched.yml
          git commit -m "Polish navigation, swipes and watched state"
          git push
