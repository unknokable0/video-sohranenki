name: SOHR Preview Build

on:
  push:
    branches: [sohr-preview, sohr-preview-675]
    paths:
      - "native/**"
      - ".github/workflows/preview-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sohr-preview-build
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      SOHR_BUILD_NUMBER: 699999
      SOHR_VERSION_NAME: preview

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compile preview APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p native :app:assembleDebug --no-daemon --stacktrace

      - name: Verify preview APK
        shell: bash
        run: |
          set -euo pipefail
          APK="native/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee /tmp/sohr-preview-badging.txt
          grep -q "package: name='com.unknokable.videosohranenki'" /tmp/sohr-preview-badging.txt
          grep -q "launchable-activity: name='com.unknokable.videosohranenki.MainActivity'" /tmp/sohr-preview-badging.txt

      - name: Preview verified
        run: echo "SOHR preview compiles. Nothing was published to the updater channel."
