name: KADR Android APK

on:
  push:
    branches:
      - cinema-prototype
    paths:
      - 'android/**'
      - '.github/workflows/kadr-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout KADR prototype
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Compile KADR debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KADR-v0.1.0-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: KADR-v0.1.0-Android
          path: KADR-v0.1.0-debug.apk
          retention-days: 30
          if-no-files-found: error
