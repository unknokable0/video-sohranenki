name: Fix fullscreen seek and video cache

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-playback-fullscreen-seek-cache.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply playback fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('native/app/src/main/java/com/unknokable/videosohranenki/MainActivity.kt')
          s = main.read_text()

          # Keep track of the Telegram-backed item whose temporary TDLib file can be removed
          # as soon as the player is closed/replaced.
          if 'private var currentStreamingItem: VideoItem? = null' not in s:
              s = s.replace(
                  'private var playerScreen: PlayerScreen? = null',
                  'private var playerScreen: PlayerScreen? = null\n    private var currentStreamingItem: VideoItem? = null'
              )

          # Release the previous temporary Telegram download before replacing the player.
          s = s.replace(
              '        playerScreen?.destroy()\n        isSettingsScreen = false',
              '        playerScreen?.destroy()\n        currentStreamingItem?.let { previous -> streamServer?.release(previous) }\n        currentStreamingItem = if (localFile == null) item else null\n        isSettingsScreen = false'
          )

          # Release temporary video data when leaving the player screen.
          s = s.replace(
              '                    root.postDelayed({ outgoingPlayer?.destroy() }, if (settings.animations) 280L else 0L)',
              '                    root.postDelayed({\n                        outgoingPlayer?.destroy()\n                        currentStreamingItem?.let { streamed -> streamServer?.release(streamed) }\n                        currentStreamingItem = null\n                    }, if (settings.animations) 280L else 0L)'
          )

          # Fullscreen: do not force an Activity orientation change. On some Android 15/16
          # devices this can tear down/reconfigure the video surface while Media3 is rendering.
          # The player still fills the screen and system bars are hidden; rotation remains user/system controlled.
          s = re.sub(
              r'\n\s*if \(settings\.autoRotateFullscreen\) \{\n\s*runCatching \{ requestedOrientation = ActivityInfo\.SCREEN_ORIENTATION_SENSOR_LANDSCAPE \}\n\s*\}',
              '', s
          )
          s = re.sub(
              r'\n\s*runCatching \{ requestedOrientation = ActivityInfo\.SCREEN_ORIENTATION_UNSPECIFIED \}',
              '', s
          )

          # Also clean stale cache much sooner and keep the ordinary cache small.
          s = s.replace(
              'val cutoff = System.currentTimeMillis() - 7L * 24L * 60L * 60L * 1000L',
              'val cutoff = System.currentTimeMillis() - 24L * 60L * 60L * 1000L'
          ).replace(
              'val maxBytes = 256L * 1024L * 1024L',
              'val maxBytes = 96L * 1024L * 1024L'
          )
          main.write_text(s)

          server = Path('native/app/src/main/java/com/unknokable/videosohranenki/TelegramStreamServer.kt')
          s = server.read_text()

          if 'fun release(item: VideoItem)' not in s:
              marker = '    fun prefetch(item: VideoItem) {'
              insert = '''    fun release(item: VideoItem) {\n        if (item.fileId <= 0) return\n        scope.launch {\n            runCatching { client.send(TdApi.CancelDownloadFile(item.fileId, false)) }\n            runCatching { client.send(TdApi.DeleteFile(item.fileId)) }\n        }\n    }\n\n'''
              s = s.replace(marker, insert + marker)

          # A seek must win over a background prefetch. Cancel the old partial range first,
          # then synchronously request the new range and retry until TDLib exposes readable bytes.
          old = '''        val result = runBlocking {\n            client.send(TdApi.DownloadFile(fileId, 32, windowStart, windowLimit, true))\n        }\n        applyLocalRange(result.local)\n\n        if (bufferedEndExclusive < requestedEnd) {\n            val retryLimit = minOf(maxOf(requested, firstWindow), endInclusive - offset + 1)\n            val retry = runBlocking {\n                    client.send(TdApi.DownloadFile(fileId, 32, offset, retryLimit, true))\n            }\n            applyLocalRange(retry.local)\n        }'''
          new = '''        if (!usePrefetch && offset > 0L) {\n            runBlocking { runCatching { client.send(TdApi.CancelDownloadFile(fileId, false)) } }\n        }\n\n        val result = runBlocking {\n            client.send(TdApi.DownloadFile(fileId, 32, windowStart, windowLimit, true))\n        }\n        applyLocalRange(result.local)\n\n        var attempts = 0\n        while (bufferedEndExclusive < requestedEnd && attempts < 3) {\n            val retryLimit = minOf(maxOf(requested, firstWindow), endInclusive - offset + 1)\n            val retry = runBlocking {\n                client.send(TdApi.DownloadFile(fileId, 32, offset, retryLimit, true))\n            }\n            applyLocalRange(retry.local)\n            attempts++\n        }'''
          if old not in s:
              raise SystemExit('TelegramFileInputStream seek block not found')
          s = s.replace(old, new)

          # MediaDataSource is used for seek previews; make arbitrary seeks deterministic too.
          old2 = '''        val limit = minOf(maxOf(requested, chunkSize), fileSize - position)\n        val result = runBlocking {\n            client.send(TdApi.DownloadFile(fileId, 24, position, limit, true))\n        }'''
          new2 = '''        val limit = minOf(maxOf(requested, chunkSize), fileSize - position)\n        if (position > 0L) {\n            runBlocking { runCatching { client.send(TdApi.CancelDownloadFile(fileId, false)) } }\n        }\n        val result = runBlocking {\n            client.send(TdApi.DownloadFile(fileId, 32, position, limit, true))\n        }'''
          if old2 not in s:
              raise SystemExit('TelegramMediaDataSource seek block not found')
          s = s.replace(old2, new2)
          server.write_text(s)

          # Mark source build for easier diagnosis.
          gradle = Path('native/app/build.gradle.kts')
          g = gradle.read_text()
          if not g.startswith('// Build marker: SOHR fullscreen + seek + cache fix'):
              g = re.sub(r'^// Build marker:.*\n', '', g)
              g = '// Build marker: SOHR fullscreen + seek + cache fix\n' + g
          gradle.write_text(g)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/app/src/main/java/com/unknokable/videosohranenki/MainActivity.kt native/app/src/main/java/com/unknokable/videosohranenki/TelegramStreamServer.kt native/app/build.gradle.kts
          git diff --cached --check
          git commit -m "Fix fullscreen crash seeking and temporary video cache"
          git push
