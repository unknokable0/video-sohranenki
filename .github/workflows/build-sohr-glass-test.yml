name: Build SOHR Glass Test

on:
  push:
    branches:
      - "test/sohr-glass-next"
    paths:
      - "native/**"
      - ".github/workflows/build-sohr-glass-test.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sohr-glass-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      SOHR_KEYSTORE_B64: ${{ secrets.SOHR_KEYSTORE_B64 }}
      SOHR_KEYSTORE_PASSWORD: ${{ secrets.SOHR_KEYSTORE_PASSWORD }}
      SOHR_KEY_ALIAS: ${{ secrets.SOHR_KEY_ALIAS }}
      SOHR_KEY_PASSWORD: ${{ secrets.SOHR_KEY_PASSWORD }}
      SOHR_BUILD_NUMBER: "600004"
      SOHR_VERSION_NAME: "6.0.0-test4"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build test APK
        shell: bash
        run: |
          if [ -n "$SOHR_KEYSTORE_B64" ]; then
            printf '%s' "$SOHR_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/native/sohr-release.jks"
            SOHR_KEYSTORE_PATH="$GITHUB_WORKSPACE/native/sohr-release.jks" gradle -p native :app:assembleRelease --no-daemon --stacktrace
            cp native/app/build/outputs/apk/release/app-release.apk SOHR-Glass-Test.apk
          else
            gradle -p native :app:assembleDebug --no-daemon --stacktrace
            cp native/app/build/outputs/apk/debug/app-debug.apk SOHR-Glass-Test.apk
          fi

      - name: Generate test updater manifest
        shell: bash
        run: |
          SHA256=$(sha256sum SOHR-Glass-Test.apk | awk '{print $1}')
          cat > update.json <<EOF
          {
            "versionCode": $SOHR_BUILD_NUMBER,
            "versionName": "$SOHR_VERSION_NAME",
            "downloadUrl": "https://github.com/$GITHUB_REPOSITORY/releases/download/sohr-test-latest/SOHR-Test.apk",
            "sha256": "$SHA256",
            "notes": "SOHR $SOHR_VERSION_NAME"
          }
          EOF

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: SOHR-Glass-Test-${{ github.run_number }}
          path: SOHR-Glass-Test.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish test updater channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp SOHR-Glass-Test.apk SOHR-Test.apk
          if gh release view sohr-test-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload sohr-test-latest SOHR-Test.apk update.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create sohr-test-latest SOHR-Test.apk update.json               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "SOHR Test Latest"               --notes "Тестовый канал обновлений SOHR."               --prerelease
          fi
