name: Update SOHR YouTube catalog

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/sync_sohr_youtube_feed.py"
      - ".github/workflows/sync-sohr-youtube-feed.yml"

permissions:
  contents: write

concurrency:
  group: sohr-youtube-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install video metadata tool
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Fetch public YouTube uploads
        run: python scripts/sync_sohr_youtube_feed.py
      - name: Publish video catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sohr_youtube_feed.json
          if git diff --cached --quiet; then
            echo "Catalog is unchanged"
            exit 0
          fi
          git commit -m "data: update SOHR public YouTube catalog"
          git pull --rebase origin main
          git push origin HEAD:main
