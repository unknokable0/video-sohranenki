name: Build SOHR AI Smart v0.4

on:
  push:
    branches: [sohr-ai-smart-v04]
    paths:
      - "ai/android/**"
      - ".github/workflows/build-sohr-ai-fusion-v02.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sohr-ai-smart-v04
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOHR_KEYSTORE_B64: ${{ secrets.SOHR_KEYSTORE_B64 }}
      SOHR_KEYSTORE_PASSWORD: ${{ secrets.SOHR_KEYSTORE_PASSWORD }}
      SOHR_KEY_ALIAS: ${{ secrets.SOHR_KEY_ALIAS }}
      SOHR_KEY_PASSWORD: ${{ secrets.SOHR_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build APK
        shell: bash
        run: |
          if [ -n "$SOHR_KEYSTORE_B64" ]; then
            printf '%s' "$SOHR_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/ai/android/sohr-ai-release.jks"
            SOHR_KEYSTORE_PATH="$GITHUB_WORKSPACE/ai/android/sohr-ai-release.jks" \
            SOHR_KEYSTORE_PASSWORD="$SOHR_KEYSTORE_PASSWORD" \
            SOHR_KEY_ALIAS="$SOHR_KEY_ALIAS" \
            SOHR_KEY_PASSWORD="$SOHR_KEY_PASSWORD" \
            gradle -p ai/android :app:assembleRelease --no-daemon --stacktrace
            cp ai/android/app/build/outputs/apk/release/app-release.apk SOHR-AI-Smart-v0.4.apk
          else
            gradle -p ai/android :app:assembleDebug --no-daemon --stacktrace
            cp ai/android/app/build/outputs/apk/debug/app-debug.apk SOHR-AI-Smart-v0.4.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOHR-AI-Smart-v0.4
          path: SOHR-AI-Smart-v0.4.apk
          if-no-files-found: error
          retention-days: 30
