name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract app
        run: unzip -q VIDEO-SOHRANENKI-source.zip -d app

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Generate Android project
        working-directory: app
        run: npx expo prebuild --platform android --non-interactive

      - name: Build APK
        working-directory: app
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        working-directory: app
        run: cp android/app/build/outputs/apk/release/app-release.apk VIDEO-SOHRANENKI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIDEO-SOHRANENKI-APK
          path: app/VIDEO-SOHRANENKI.apk
          if-no-files-found: error
          retention-days: 30
