          if "chunked(3)" not in dialogs or "dp(context, 96)" not in dialogs:
              raise SystemExit("Appearance palette readability regression")
          for required in [
              "val overlay = FrameLayout(context)",
              "FrameLayout.LayoutParams(",
              "Gravity.CENTER",
              "ViewGroup.LayoutParams.MATCH_PARENT",
              "windowAnimations = 0",
              "box.visibility = View.VISIBLE",
              "box.alpha = 1f",
              "overlay.addOnLayoutChangeListener"
          ]:
              if required not in dialogs:
                  raise SystemExit(f"SOHR 6.7.7 first-frame dialog regression: {required}")
          for forbidden in [
              "box.visibility = View.INVISIBLE",
              "stablePasses >=",
              "box.postDelayed({"
          ]:
              if forbidden in dialogs:
                  raise SystemExit(f"SOHR 6.7.7 delayed-dialog regression: {forbidden}")
          if "LinearLayout.LayoutParams(dp(context, 38), dp(context, 4))" in dialogs:
              raise SystemExit("Legacy dialog top handle regression")

          if "BitmapFactory.decodeFile" in player:
              raise SystemExit("Synchronous thumbnail decoding regression")

          for required in [
              ".setForceHighestSupportedBitrate(true)",
              '"Лучшее • максимальный битрейт"',
              '"Авто • адаптивное качество"',
              ".setForceHighestSupportedBitrate(false)"
          ]:
              if required not in player:
                  raise SystemExit(f"SOHR 6.6.10 Media3 highest-bitrate regression: {required}")
          if '"Авто • лучшее доступное"' in player:
              raise SystemExit("SOHR 6.6.10 regression: adaptive Auto is mislabeled as best")

          twitch_player = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/TwitchPlayerScreen.kt"
          ).read_text(encoding="utf-8")
          if "dp(300)" in twitch_player:
              raise SystemExit("Fixed-height Twitch player regression")
          for required in ["availableWidth", "showPlayerSettings()", "9f / 16f"]:
              if required not in twitch_player:
                  raise SystemExit(f"Adaptive Twitch player UI missing: {required}")
          if "topMargin = dp(2)" in twitch_player:
              raise SystemExit("SOHR 6.3.4 Twitch player regression: header gap returned")


          splash = Path("native/app/src/main/res/values-v31/styles.xml")
          if not splash.is_file():
              raise SystemExit("Android 12 splash override missing")

          v31_styles = splash.read_text(encoding="utf-8")
          for required in [
              "@drawable/splash_empty",
              "<item name=\"windowSplashScreenAnimationDuration\">0</item>",
              "<item name=\"windowSplashScreenBackground\">#08070D</item>"
          ]:
              if required not in v31_styles:
                  raise SystemExit(f"SOHR 6.2.8 Android 12 blank splash regression: {required}")
          if "@drawable/sohr_splash_mark" in v31_styles:
              raise SystemExit("SOHR 6.2.8 regression: static Android 12 splash logo returned")

          obsolete_splash = Path("native/app/src/main/res/drawable/sohr_splash_mark.xml")
          if obsolete_splash.exists():
              raise SystemExit("SOHR 6.2.8 regression: obsolete static splash mark file returned")

          icon = Path("native/app/src/main/res/drawable-nodpi/sohr_brand_logo_v3.webp")
          if not icon.is_file() or icon.stat().st_size < 4096:
              raise SystemExit(f"SOHR 6.3.4 launcher asset missing or too small: {icon}")

          print(f"SOHR 6 UI assets verified; launcher={icon.stat().st_size} bytes")
          PY

      - name: Generate updater manifest
        shell: bash
        run: |
          SHA256=$(sha256sum SOHR.apk | awk '{print $1}')
          cat > update.json <<EOF
          {
            "versionCode": $SOHR_BUILD_NUMBER,
            "versionName": "$SOHR_VERSION_NAME",
            "downloadUrl": "https://github.com/$GITHUB_REPOSITORY/releases/download/sohr-latest/$SOHR_APK_ASSET",
            "sha256": "$SHA256",
            "notes": "SOHR 6.7.8 • YouTube-воспроизведение усилено полноценным локальным BotGuard/PO Token fallback: NewPipe остаётся первым путём, а при anti-bot проверке SOHR получает свежий visitorData, генерирует session/video PO Token на устройстве, использует актуальный signature timestamp и расшифровывает signature/n через закреплённый zemer-cipher • прямые video+audio потоки по-прежнему открываются только в нативном Media3 PlayerScreen SOHR без YouTube WebView-плеера • перед отдачей поток проверяется range-запросом • возрастные ограничения AGE_CHECK_REQUIRED/AGE_VERIFICATION_REQUIRED остаются заблокированы и не обходятся • исправления мгновенных ModernDialogs из 6.7.7 сохранены"
          }
          EOF
          cat update.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOHR-${{ github.run_number }}
          path: |
            SOHR.apk
            ${{ env.SOHR_APK_ASSET }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish updater channel
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view sohr-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload sohr-latest "$SOHR_APK_ASSET" SOHR.apk update.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create sohr-latest "$SOHR_APK_ASSET" SOHR.apk update.json \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SOHR Latest" \
              --notes "Автоматический канал обновлений SOHR." \
              --prerelease
          fi


      - name: Verify published updater channel
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf verify-release
          mkdir verify-release
          cd verify-release

          gh release download sohr-latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "update.json" \
            --pattern "$SOHR_APK_ASSET"

          TEST_CODE="$(python3 -c 'import json; print(json.load(open("update.json"))["versionCode"])')"
          TEST_NAME="$(python3 -c 'import json; print(json.load(open("update.json"))["versionName"])')"
          TEST_URL="$(python3 -c 'import json; print(json.load(open("update.json"))["downloadUrl"])')"
          EXPECTED_SHA="$(python3 -c 'import json; print(json.load(open("update.json"))["sha256"])')"
          ACTUAL_SHA="$(sha256sum "$SOHR_APK_ASSET" | awk '{print $1}')"

          test "$TEST_CODE" = "$SOHR_BUILD_NUMBER"
          test "$TEST_NAME" = "$SOHR_VERSION_NAME"
          echo "$TEST_URL" | grep -Fq "/$SOHR_APK_ASSET"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"

          echo "Updater verified: $SOHR_VERSION_NAME ($SOHR_BUILD_NUMBER)"
          echo "Asset: $SOHR_APK_ASSET"
          echo "SHA-256: $ACTUAL_SHA"
