name: Build Android APK

# SOHR 5.3 test channel: Twitch Device Code Flow
on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sohr-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      SOHR_KEYSTORE_B64: ${{ secrets.SOHR_KEYSTORE_B64 }}
      SOHR_KEYSTORE_PASSWORD: ${{ secrets.SOHR_KEYSTORE_PASSWORD }}
      SOHR_KEY_ALIAS: ${{ secrets.SOHR_KEY_ALIAS }}
      SOHR_KEY_PASSWORD: ${{ secrets.SOHR_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Assign SOHR 5.3.0-test7 version
        shell: bash
        run: |
          echo "SOHR_BUILD_NUMBER=503007" >> "$GITHUB_ENV"
          echo "SOHR_VERSION_NAME=5.3.0-test7" >> "$GITHUB_ENV"

      - name: Verify Twitch Device Code endpoint
        if: ${{ env.TWITCH_CLIENT_ID != '' }}
        shell: bash
        run: |
          RESPONSE="$(curl --silent --show-error --fail-with-body \
            -X POST 'https://id.twitch.tv/oauth2/device' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$TWITCH_CLIENT_ID" \
            --data-urlencode 'scopes=' 2>/tmp/twitch-device-error.txt || true)"
          export RESPONSE
          python3 - <<'PY'
          import json, os, sys
          raw = os.environ.get("RESPONSE", "")
          try:
              data = json.loads(raw)
          except Exception:
              print("Twitch Device Code endpoint returned invalid JSON", file=sys.stderr)
              sys.exit(1)
          if not data.get("device_code") or not data.get("verification_uri"):
              print("Twitch Device Code endpoint rejected this Client ID: " + str(data), file=sys.stderr)
              sys.exit(1)
          print("Twitch Device Code endpoint OK")
          PY

      - name: Build installable APK
        shell: bash
        run: |
          if [ -n "$SOHR_KEYSTORE_B64" ]; then
            printf '%s' "$SOHR_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/native/sohr-release.jks"
            SOHR_KEYSTORE_PATH="$GITHUB_WORKSPACE/native/sohr-release.jks" SOHR_KEYSTORE_PASSWORD="$SOHR_KEYSTORE_PASSWORD" SOHR_KEY_ALIAS="$SOHR_KEY_ALIAS" SOHR_KEY_PASSWORD="$SOHR_KEY_PASSWORD" gradle -p native :app:assembleRelease --no-daemon --stacktrace
            cp native/app/build/outputs/apk/release/app-release.apk SOHR.apk
          else
            gradle -p native :app:assembleDebug --no-daemon --stacktrace
            cp native/app/build/outputs/apk/debug/app-debug.apk SOHR.apk
          fi

      - name: Generate updater manifest
        shell: bash
        run: |
          SHA256=$(sha256sum SOHR.apk | awk '{print $1}')
          cat > update.json <<EOF
          {
            "versionCode": $SOHR_BUILD_NUMBER,
            "versionName": "$SOHR_VERSION_NAME",
            "downloadUrl": "https://github.com/$GITHUB_REPOSITORY/releases/download/sohr-latest/SOHR.apk",
            "sha256": "$SHA256",
            "notes": "SOHR 5.3.0-test7 • Twitch Device Code Flow • no redirect or GitHub Pages dependency"
          }
          EOF
          cat update.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOHR-${{ github.run_number }}
          path: SOHR.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish updater channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view sohr-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload sohr-latest SOHR.apk update.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create sohr-latest SOHR.apk update.json \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SOHR Latest" \
              --notes "Автоматический канал обновлений SOHR." \
              --prerelease
          fi
