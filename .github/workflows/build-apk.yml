name: Build Android APK

# SOHR 6.3.8: immediate bottom nav, faster notifications and polished icons
# Rebuild marker: test34 runner restart
# Final release trigger: SOHR 6.0.15 playback fix
on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sohr-build-main-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      SOHR_KEYSTORE_B64: ${{ secrets.SOHR_KEYSTORE_B64 }}
      SOHR_KEYSTORE_PASSWORD: ${{ secrets.SOHR_KEYSTORE_PASSWORD }}
      SOHR_KEY_ALIAS: ${{ secrets.SOHR_KEY_ALIAS }}
      SOHR_KEY_PASSWORD: ${{ secrets.SOHR_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Assign SOHR 6.3.8 version
        shell: bash
        run: |
          echo "SOHR_BUILD_NUMBER=630008" >> "$GITHUB_ENV"
          echo "SOHR_VERSION_NAME=6.3.8" >> "$GITHUB_ENV"

      - name: Verify Twitch OAuth authorize endpoint
        shell: bash
        run: |
          CLIENT_ID="${TWITCH_CLIENT_ID:-gnr3cikerodr25wpbrb04a11031qiz}"
          REDIRECT="https://unknokable0.github.io/video-sohranenki/twitch-auth/"
          URL="https://id.twitch.tv/oauth2/authorize?response_type=token&client_id=$CLIENT_ID&redirect_uri=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("'"$REDIRECT"'", safe=""))')&scope=chat%3Aread%20chat%3Aedit&state=sohr-build-check"
          CODE="$(curl --silent --show-error --location --max-time 20 --output /tmp/twitch-oauth.html --write-out '%{http_code}' "$URL" || true)"
          if [ "$CODE" -ge 400 ] || [ "$CODE" -lt 200 ]; then
            echo "Twitch OAuth authorize endpoint failed with HTTP $CODE" >&2
            cat /tmp/twitch-oauth.html >&2 || true
            exit 1
          fi
          if grep -Eqi 'invalid redirect|redirect uri.*invalid|invalid client' /tmp/twitch-oauth.html; then
            echo "Twitch rejected OAuth client or redirect URI" >&2
            cat /tmp/twitch-oauth.html >&2
            exit 1
          fi
          echo "Twitch OAuth authorize endpoint reachable (HTTP $CODE)"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          : "${SOHR_KEYSTORE_B64:?SOHR release keystore is required}"
          : "${SOHR_KEYSTORE_PASSWORD:?SOHR keystore password is required}"
          : "${SOHR_KEY_ALIAS:?SOHR key alias is required}"
          : "${SOHR_KEY_PASSWORD:?SOHR key password is required}"

          printf '%s' "$SOHR_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/native/sohr-release.jks"
          SOHR_KEYSTORE_PATH="$GITHUB_WORKSPACE/native/sohr-release.jks"           SOHR_KEYSTORE_PASSWORD="$SOHR_KEYSTORE_PASSWORD"           SOHR_KEY_ALIAS="$SOHR_KEY_ALIAS"           SOHR_KEY_PASSWORD="$SOHR_KEY_PASSWORD"             gradle -p native :app:assembleRelease --no-daemon --stacktrace

          cp native/app/build/outputs/apk/release/app-release.apk SOHR.apk

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs SOHR.apk | tee /tmp/sohr-signing.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/sohr-signing.txt

          APK_ASSET="SOHR-${SOHR_BUILD_NUMBER}.apk"
          cp SOHR.apk "$APK_ASSET"
          echo "SOHR_APK_ASSET=$APK_ASSET" >> "$GITHUB_ENV"

      - name: Verify APK metadata
        shell: bash
        run: |
          set -euo pipefail

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$AAPT"
          "$AAPT" dump badging SOHR.apk | tee /tmp/sohr-badging.txt
          grep -q "package: name='com.unknokable.videosohranenki'" /tmp/sohr-badging.txt
          grep -q "launchable-activity: name='com.unknokable.videosohranenki.MainActivity'" /tmp/sohr-badging.txt

      - name: Audit release manifest
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump permissions SOHR.apk | tee /tmp/sohr-permissions.txt
          grep -q "android.permission.INTERNET" /tmp/sohr-permissions.txt
          grep -q "android.permission.POST_NOTIFICATIONS" /tmp/sohr-permissions.txt
          if grep -E "READ_SMS|SEND_SMS|READ_CONTACTS|WRITE_CONTACTS|RECORD_AUDIO|CAMERA|ACCESS_FINE_LOCATION|QUERY_ALL_PACKAGES" /tmp/sohr-permissions.txt; then
            echo "Unexpected sensitive permission found in SOHR release" >&2
            exit 1
          fi

      - name: Verify SOHR 6.0 UI assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_root = Path("native/app/src/main")
          informal = re.compile(
              r"(?<![А-Яа-яЁёІіЇїЄєҐґ])"
              r"(ты|тебя|тебе|тобой|твой|твоя|твоё|твое|твои|твоих|твоей|"
              r"продолжай|нажми|посмотри|выбери|введи|проверь|попробуй|"
              r"подключи|войди|открой|скачай|добавь|удали|перейди|разреши|"
              r"подтверди|верни|обнови|обери|перевір)"
              r"(?![А-Яа-яЁёІіЇїЄєҐґ])",
              re.IGNORECASE,
          )
          for source in source_root.rglob("*"):
              if source.suffix not in {".kt", ".xml"}:
                  continue
              text = source.read_text(encoding="utf-8")
              for line_no, line in enumerate(text.splitlines(), start=1):
                  if '"' in line and informal.search(line):
                      raise SystemExit(
                          f"Informal user address found: {source}:{line_no}: {line.strip()}"
                      )

          checks = {
              "native/app/src/main/java/com/unknokable/videosohranenki/ThemePalette.kt": [
                  '"magenta"', '"sunset"', '"ocean"', '"ice"', '"mint"',
                  '"rose"', '"amber"', '"lime"', '"aqua"', '"indigo"', '"crimson"',
                  '"electric"', '"emerald"', '"gold"', '"coral"', '"lavender"', '"ruby"'
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/SettingsScreen.kt": [
                  "private fun appearanceSelector", "showAppearancePicker", "AppThemes.Presets"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/DayCollectionAdapter.kt": [
                  "R.drawable.ic_chevron_right"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/ModernDialogs.kt": [
                  "R.drawable.ic_close", "R.drawable.ic_check", "fun showAppearancePicker"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/LoadingWaveView.kt": [
                  "syncAnimator", "outlinePath", "segmentPath", "PathMeasure", "segmentPaint", "cycleMs = 1850L", "SystemClock.uptimeMillis()"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/SohrBottomNavView.kt": [
                  "syncSelected", "private fun requestIndex(target: Int)"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/HomeVideoShelfAdapter.kt": [
                  "lastPlayedAtFor", "24L * 60L * 60L * 1000L"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/PlayerScreen.kt": [
                  "R.drawable.ic_player_settings"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/TwitchPlayerScreen.kt": [
                  "R.drawable.ic_replay_10", "R.drawable.ic_forward_10", "R.drawable.ic_player_settings"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/TwitchLivePlayerScreen.kt": [
                  "R.drawable.ic_player_settings"
              ],
          }

          for file_name, needles in checks.items():
              text = Path(file_name).read_text(encoding="utf-8")
              missing = [needle for needle in needles if needle not in text]
              if missing:
                  raise SystemExit(f"{file_name}: missing {missing}")

          loader = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/LoadingWaveView.kt"
          ).read_text(encoding="utf-8")
          forbidden_loader_patterns = ["segmentGlowPaint", "headPaint", "drawCircle("]
          found_loader_forbidden = [p for p in forbidden_loader_patterns if p in loader]
          if found_loader_forbidden:
              raise SystemExit(
                  f"Loader glow/head regression detected: {found_loader_forbidden}"
              )

          player = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/PlayerScreen.kt"
          ).read_text(encoding="utf-8")
          forbidden_player_patterns = [
              "forceEnableMediaCodecAsynchronousQueueing",
              "setCompoundDrawablesRelative(",
              "setCompoundDrawablesRelativeWithIntrinsicBounds("
          ]
          found_forbidden = [p for p in forbidden_player_patterns if p in player]
          if found_forbidden:
              raise SystemExit(
                  f"Unsafe player regression detected: {found_forbidden}"
              )
          for required in ["PlayerActionPill", "setActionIconSafely", "ExoPlayer.Builder(activity)"]:
              if required not in player:
                  raise SystemExit(f"Player hardening missing: {required}")

          sohr_main = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/MainActivity.kt"
          ).read_text(encoding="utf-8")
          for required in [
              "buildTodayCard",
              "R.drawable.ic_search",
              "showVideoQuickActions",
              "showFeedSkeleton",
              "handleOnBackProgressed",
              "prepareForPictureInPicture"
          ]:
              if required not in sohr_main:
                  raise SystemExit(f"SOHR 6.1 home/PiP feature missing: {required}")

          player = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/PlayerScreen.kt"
          ).read_text(encoding="utf-8")
          for required in [
              "prepareForPictureInPicture",
              "restoreFromPictureInPicture",
              "animateEntranceFrom",
              "ambientGradient"
          ]:
              if required not in player:
                  raise SystemExit(f"SOHR 6.1 player polish missing: {required}")
          if "topMargin = dp(13)" in player:
              raise SystemExit("SOHR 6.3.4 player regression: detached strip above Telegram player returned")

          if "root.background = ambientGradient" in player:
              raise SystemExit("SOHR 6.3.5 player regression: full-screen ambient background returned")
          if "listener(onSuccess = { _, result -> updateAmbientFromDrawable" in player:
              raise SystemExit("SOHR 6.3.5 player regression: poster ambient sampling returned")
          for required in [
              "root.setBackgroundColor(palette.background)",
              "ambientColor = target",
              "root.setBackgroundColor(palette.background)"
          ]:
              if required not in player:
                  raise SystemExit(f"SOHR 6.3.5 unified-player-background regression: {required}")


          manifest = Path("native/app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          if 'android:enableOnBackInvokedCallback="true"' not in manifest:
              raise SystemExit("Predictive Back manifest integration missing")

          home_cards = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/HomeVideoShelfAdapter.kt"
          ).read_text(encoding="utf-8")
          video_cards = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/VideoAdapter.kt"
          ).read_text(encoding="utf-8")
          if "setOnLongClickListener" not in home_cards or "setOnLongClickListener" not in video_cards:
              raise SystemExit("Video long-press actions regression")
          for required in [
              "screenWidth * 0.60f",
              "val blend = View(context)",
              "setDuration(240L)",
              "cornerRadius = dp(context, 18).toFloat()"
          ]:
              if required not in home_cards:
                  raise SystemExit(f"Unified compact home-card regression: {required}")

          bottom_nav = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/SohrBottomNavView.kt"
          ).read_text(encoding="utf-8")
          for required in [
              "if (!animate) positionIndicator(false)",
              "Always forward the tap",
              "ValueAnimator.ofFloat(from, to)"
          ]:
              if required not in bottom_nav:
                  raise SystemExit(f"Bottom navigation animation regression: {required}")

          if "T2x2 • в сети" not in sohr_main or "T2x2 • не в сети" not in sohr_main:
              raise SystemExit("T2x2 live status copy regression")

          for required in [
              'section !in 1..3',
              'listOf("Главная" to 1, "Лента" to 2, "Просмотренные" to 3)',
              '"Здесь позже появятся сообщения из Telegram-каналов."',
              '"Просмотренные по дням"',
              'val searchableText = buildString',
              'loadVideos(inPlace = true, quiet = true)',
              'withContext(Dispatchers.IO) {\n                    videoCache.load()'
          ]:
              if required not in sohr_main:
                  raise SystemExit(f"SOHR 6.3.2 top-tabs/search/cache regression: {required}")

          for required in [
              "pendingVideoSectionCrossfade = false",
              "suppressNextContentAnimation = true",
              "body.alpha = 0.92f",
              ".setDuration(170L)",
              "SohrBackgroundCheckWorker.schedule(this)",
              'UPDATE_NOTIFICATION_CHANNEL = "sohr_updates_v2"',
              'setContentTitle("T2x2 в эфире")',
              "consumeUpdateNotificationIntent"
          ]:
              if required not in sohr_main:
                  raise SystemExit(f"SOHR 6.3.5 stable-tabs/notification regression: {required}")
          if "val travel = dp(20).toFloat()" in sohr_main:
              raise SystemExit("SOHR 6.3.5 top-tab regression: horizontal page travel returned")


          if 'sohr_brand_logo' in loader or 'ImageView' in loader:
              raise SystemExit("SOHR 6.3.1 regression: launcher artwork returned to cloud loading animation")

          for required in [
              "baseStroke = (minDp * 0.046f)",
              "activeStroke = (minDp * 0.061f)",
              "cycleMs = 1850L",
              "0.068f * sin",
              "val segmentLength = length * 0.275f"
          ]:
              if required not in loader:
                  raise SystemExit(f"SOHR 6.3.5 premium cloud-loader regression: {required}")
          if "setStroke(dp(context, 1), palette.stroke)" in home_cards:
              raise SystemExit("Home card outline regression")
          if "compactPreviewHeight + dp(68)" not in sohr_main:
              raise SystemExit("Home card text-height regression")
          for required in [
              "registerSearchBackInterceptor",
              "PRIORITY_OVERLAY",
              "unregisterSearchBackInterceptor"
          ]:
              if required not in sohr_main:
                  raise SystemExit(f"Search back interceptor regression: {required}")

          bottom_nav = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/SohrBottomNavView.kt"
          ).read_text(encoding="utf-8")
          if "setOnTouchListener" in bottom_nav:
              raise SystemExit("Bottom navigation touch interception regression")
          if "requestLocked" in bottom_nav:
              raise SystemExit("Bottom navigation artificial lock regression")
          for required in [
              "onSelect(tabs[target])",
              "duration = 105L",
              ".setDuration(90L)"
          ]:
              if required not in bottom_nav:
                  raise SystemExit(f"SOHR 6.3.8 bottom-nav responsiveness regression: {required}")
          if "postOnAnimation" in bottom_nav:
              raise SystemExit("SOHR 6.3.8 regression: bottom nav next-frame delay returned")

          experience_store = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/SohrExperienceStore.kt"
          ).read_text(encoding="utf-8")
          for required in [
              "fun beginVisit",
              "fun queueIds",
              "fun addNext",
              "fun addLast"
          ]:
              if required not in experience_store:
                  raise SystemExit(f"SOHR 6.2 experience-store regression: {required}")
          for forbidden in ["SohrMonthlyRecap", "recordWatchTime", "recordPlayStart", "mostActiveDay"]:
              if forbidden in experience_store:
                  raise SystemExit(f"SOHR 6.2.6 removed Recap tracking returned: {forbidden}")

          for removed_path in [
              "native/app/src/main/java/com/unknokable/videosohranenki/SohrMomentsStore.kt",
              "native/app/src/main/java/com/unknokable/videosohranenki/SohrRecapStore.kt",
              "native/app/src/main/res/drawable/ic_setting_moments.xml",
              "native/app/src/main/res/drawable/ic_setting_recap.xml"
          ]:
              if Path(removed_path).exists():
                  raise SystemExit(f"SOHR 6.3.2 removed feature returned: {removed_path}")

          session_adapter = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/PlaybackSessionAdapter.kt"
          ).read_text(encoding="utf-8")
          for required in ["Collections.swap", "fun move(", "fun ids()"]:
              if required not in session_adapter:
                  raise SystemExit(f"SOHR 6.3.0 playback-session regression: {required}")

          streak_tracker = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/StreakTracker.kt"
          ).read_text(encoding="utf-8")
          for required in [
              "fun protectionTokens",
              "fun protectedDays",
              "ensureProtection",
              "MAX_PROTECTION_TOKENS = 2"
          ]:
              if required not in streak_tracker:
                  raise SystemExit(f"SOHR 6.3.0 streak protection regression: {required}")

          download_store = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/SohrDownloadStore.kt"
          ).read_text(encoding="utf-8")
          for required in ["SohrDownloadEntry", "fun register", "fun remove", "fun totalBytes"]:
              if required not in download_store:
                  raise SystemExit(f"SOHR 6.2 download-center regression: {required}")

          for required in ["autoManaged", "fun autoEntries"]:
              if required not in download_store:
                  raise SystemExit(f"SOHR 6.3.0 smart-download store regression: {required}")

          motion = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/SohrMotion.kt"
          ).read_text(encoding="utf-8")
          for required in ["const val FAST", "const val NORMAL", "const val HERO", "object SohrHaptics"]:
              if required not in motion:
                  raise SystemExit(f"SOHR 6.2 motion regression: {required}")

          media_session = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/SohrMediaSessionBridge.kt"
          ).read_text(encoding="utf-8")
          for required in ["MediaSession.Builder", "MediaMetadata.Builder", "T2x2 • SOHR"]:
              if required not in media_session:
                  raise SystemExit(f"SOHR 6.2 MediaSession regression: {required}")

          settings_screen = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/SettingsScreen.kt"
          ).read_text(encoding="utf-8")
          for required in ["previewModeSelector", '"Wi‑Fi"', '"Всегда"', '"Выкл"']:
              if required not in settings_screen:
                  raise SystemExit(f"SOHR 6.2 preview-setting regression: {required}")

          app_settings = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/AppSettings.kt"
          ).read_text(encoding="utf-8")
          if "var previewMode: String" not in app_settings:
              raise SystemExit("SOHR 6.2 preview-mode persistence regression")

          if "var smartDownloads: Boolean" not in app_settings:
              raise SystemExit("SOHR 6.3.0 smart-download setting regression")

          background_worker = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/SohrBackgroundCheckWorker.kt"
          ).read_text(encoding="utf-8")
          for required in [
              "PeriodicWorkRequestBuilder<SohrBackgroundCheckWorker>",
              "NetworkType.CONNECTED",
              "ExistingPeriodicWorkPolicy.UPDATE",
              "SohrUpdateManager(applicationContext).check()",
              'TwitchApi.loadLiveStream(clientId, token, "t2x2")',
              'KEY_LAST_UPDATE_NOTIFICATION = "last_update_notified_code"',
              'KEY_LAST_T2X2_NOTIFICATION = "last_t2x2_notified_started_at"',
              '"Доступно обновление SOHR',
              '"T2x2 в эфире"'
          ]:
              if required not in background_worker:
                  raise SystemExit(f"SOHR 6.3.4 background notification regression: {required}")

          gradle_app = Path("native/app/build.gradle.kts").read_text(encoding="utf-8")
          if "androidx.work:work-runtime-ktx:2.10.1" not in gradle_app:
              raise SystemExit("SOHR 6.3.4 WorkManager dependency regression")
          if not Path("native/app/src/main/res/drawable/ic_notification_update.xml").is_file():
              raise SystemExit("SOHR 6.3.4 update notification icon missing")

          for required in [
              "nav.translationY = 0f",
              "nav.alpha = 1f",
              'else -> unwatchedVideos.size.toString() + " новых"',
              'contentDescription = "Назад"'
          ]:
              if required not in sohr_main:
                  raise SystemExit(f"SOHR 6.2.6 stable-nav/UI regression: {required}")
          if ".translationY(dp(30).toFloat())" in sohr_main:
              raise SystemExit("SOHR 6.2.6 regression: bottom navigation moves during feed scroll")

          for required in [
              "fun modeLabel(mode: String)",
              "ModernDialogs.showChoices",
              '"Тихое превью • " + modeLabel(settings.previewMode)'
          ]:
              if required not in settings_screen:
                  raise SystemExit(f"SOHR 6.2.1 compact preview-setting regression: {required}")

          if 'title = "Моменты"' in settings_screen or 'title = "SOHR Recap"' in settings_screen:
              raise SystemExit("SOHR 6.3.2 regression: removed Moments/Recap settings returned")
          for required in [
              'title = "Умное скачивание"',
              "R.drawable.ic_setting_smart_download"
          ]:
              if required not in settings_screen:
                  raise SystemExit(f"SOHR 6.3.2 settings regression: {required}")

          smart_icon = Path("native/app/src/main/res/drawable/ic_setting_smart_download.xml").read_text(encoding="utf-8")
          appearance_icon = Path("native/app/src/main/res/drawable/ic_setting_appearance.xml").read_text(encoding="utf-8")
          if "M12,4.2v9.1" not in smart_icon:
              raise SystemExit("SOHR 6.3.8 smart-download icon regression")
          if "M5.3,18.7L15.7,8.3" not in appearance_icon:
              raise SystemExit("SOHR 6.3.8 appearance icon regression")

          preview_pos = settings_screen.find("root.addView(previewModeSelector())")
          autoplay_pos = settings_screen.find('title = "Автовоспроизведение"')
          if preview_pos < 0 or autoplay_pos < 0 or preview_pos > autoplay_pos:
              raise SystemExit("SOHR 6.2.2 settings order regression: preview must be above autoplay")

          for required in ["cachedEntries", "@Volatile private var cachedEntries"]:
              if required not in download_store:
                  raise SystemExit(f"SOHR 6.2.2 download cache regression: {required}")

          for required in ["queueCache", "@Volatile private var queueCache"]:
              if required not in experience_store:
                  raise SystemExit(f"SOHR 6.2.2 queue cache regression: {required}")

          for required in [
              "withContext(Dispatchers.IO) { videoCache.load() }",
              "val cachedById = cachedBeforeRefresh.associateBy",
              "withContext(Dispatchers.IO) {\n                    videoCache.save(preparedVideos)",
              "setHasFixedSize(true)",
              "setItemViewCacheSize(5)"
          ]:
              if required not in sohr_main:
                  raise SystemExit(f"SOHR 6.2.2 main-thread/perf regression: {required}")

          for required in ["lastClickAtMs", "SystemClock.elapsedRealtime()", "SohrMotion.FAST"]:
