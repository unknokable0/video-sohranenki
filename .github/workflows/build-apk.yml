name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build installable APK
        run: gradle -p native :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: cp native/app/build/outputs/apk/debug/app-debug.apk SOHR-BETA-2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOHR-BETA-2.0
          path: SOHR-BETA-2.0.apk
          if-no-files-found: error
          retention-days: 30
