# SOHR 3.0.10 verified build trigger
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sohr-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      SOHR_KEYSTORE_B64: ${{ secrets.SOHR_KEYSTORE_B64 }}
      SOHR_KEYSTORE_PASSWORD: ${{ secrets.SOHR_KEYSTORE_PASSWORD }}
      SOHR_KEY_ALIAS: ${{ secrets.SOHR_KEY_ALIAS }}
      SOHR_KEY_PASSWORD: ${{ secrets.SOHR_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build installable APK
        shell: bash
        run: |
          if [ -n "$SOHR_KEYSTORE_B64" ]; then
            printf '%s' "$SOHR_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/native/sohr-release.jks"
            SOHR_KEYSTORE_PATH="$GITHUB_WORKSPACE/native/sohr-release.jks"             SOHR_KEYSTORE_PASSWORD="$SOHR_KEYSTORE_PASSWORD"             SOHR_KEY_ALIAS="$SOHR_KEY_ALIAS"             SOHR_KEY_PASSWORD="$SOHR_KEY_PASSWORD"             gradle -p native :app:assembleRelease --no-daemon --stacktrace
            cp native/app/build/outputs/apk/release/app-release.apk SOHR.apk
          else
            gradle -p native :app:assembleDebug --no-daemon --stacktrace
            cp native/app/build/outputs/apk/debug/app-debug.apk SOHR.apk
          fi

      - name: Generate updater manifest
        shell: bash
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' native/app/build.gradle.kts | head -1)
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' native/app/build.gradle.kts | head -1)
          SHA256=$(sha256sum SOHR.apk | awk '{print $1}')
          cat > update.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "downloadUrl": "https://github.com/$GITHUB_REPOSITORY/releases/download/sohr-latest/SOHR.apk",
            "sha256": "$SHA256",
            "notes": "Новая версия SOHR готова к установке."
          }
          EOF
          cat update.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOHR-BETA-3.0
          path: SOHR.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish updater channel
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view sohr-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload sohr-latest SOHR.apk update.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create sohr-latest SOHR.apk update.json \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SOHR Latest" \
              --notes "Автоматический канал обновлений SOHR." \
              --prerelease
          fi
