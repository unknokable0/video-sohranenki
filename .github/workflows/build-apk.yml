name: Build Android APK

# SOHR 6.0.0: visual system refresh + verified updater
# Rebuild marker: test34 runner restart
on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sohr-build-main-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      SOHR_KEYSTORE_B64: ${{ secrets.SOHR_KEYSTORE_B64 }}
      SOHR_KEYSTORE_PASSWORD: ${{ secrets.SOHR_KEYSTORE_PASSWORD }}
      SOHR_KEY_ALIAS: ${{ secrets.SOHR_KEY_ALIAS }}
      SOHR_KEY_PASSWORD: ${{ secrets.SOHR_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Assign SOHR 6.0.3 version
        shell: bash
        run: |
          echo "SOHR_BUILD_NUMBER=600003" >> "$GITHUB_ENV"
          echo "SOHR_VERSION_NAME=6.0.3" >> "$GITHUB_ENV"

      - name: Verify Twitch OAuth authorize endpoint
        shell: bash
        run: |
          CLIENT_ID="${TWITCH_CLIENT_ID:-gnr3cikerodr25wpbrb04a11031qiz}"
          REDIRECT="https://unknokable0.github.io/video-sohranenki/twitch-auth/"
          URL="https://id.twitch.tv/oauth2/authorize?response_type=token&client_id=$CLIENT_ID&redirect_uri=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("'"$REDIRECT"'", safe=""))')&scope=chat%3Aread%20chat%3Aedit&state=sohr-build-check"
          CODE="$(curl --silent --show-error --location --max-time 20 --output /tmp/twitch-oauth.html --write-out '%{http_code}' "$URL" || true)"
          if [ "$CODE" -ge 400 ] || [ "$CODE" -lt 200 ]; then
            echo "Twitch OAuth authorize endpoint failed with HTTP $CODE" >&2
            cat /tmp/twitch-oauth.html >&2 || true
            exit 1
          fi
          if grep -Eqi 'invalid redirect|redirect uri.*invalid|invalid client' /tmp/twitch-oauth.html; then
            echo "Twitch rejected OAuth client or redirect URI" >&2
            cat /tmp/twitch-oauth.html >&2
            exit 1
          fi
          echo "Twitch OAuth authorize endpoint reachable (HTTP $CODE)"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          : "${SOHR_KEYSTORE_B64:?SOHR release keystore is required}"
          : "${SOHR_KEYSTORE_PASSWORD:?SOHR keystore password is required}"
          : "${SOHR_KEY_ALIAS:?SOHR key alias is required}"
          : "${SOHR_KEY_PASSWORD:?SOHR key password is required}"

          printf '%s' "$SOHR_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/native/sohr-release.jks"
          SOHR_KEYSTORE_PATH="$GITHUB_WORKSPACE/native/sohr-release.jks"           SOHR_KEYSTORE_PASSWORD="$SOHR_KEYSTORE_PASSWORD"           SOHR_KEY_ALIAS="$SOHR_KEY_ALIAS"           SOHR_KEY_PASSWORD="$SOHR_KEY_PASSWORD"             gradle -p native :app:assembleRelease --no-daemon --stacktrace

          cp native/app/build/outputs/apk/release/app-release.apk SOHR.apk

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs SOHR.apk | tee /tmp/sohr-signing.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/sohr-signing.txt

          APK_ASSET="SOHR-${SOHR_BUILD_NUMBER}.apk"
          cp SOHR.apk "$APK_ASSET"
          echo "SOHR_APK_ASSET=$APK_ASSET" >> "$GITHUB_ENV"

      - name: Verify BlueStacks APK compatibility
        shell: bash
        run: |
          set -euo pipefail

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          if [ -z "$AAPT" ]; then
            echo "Android aapt not found" >&2
            exit 1
          fi

          "$AAPT" dump badging SOHR.apk | tee /tmp/sohr-badging.txt

          grep -q "package: name='com.unknokable.videosohranenki'" /tmp/sohr-badging.txt
          grep -q "launchable-activity: name='com.unknokable.videosohranenki.MainActivity'" /tmp/sohr-badging.txt

          MIN_SDK="$(sed -n "s/.*sdkVersion:'\\([0-9][0-9]*\\)'.*/\\1/p" /tmp/sohr-badging.txt | head -1)"
          echo "SOHR minSdk=$MIN_SDK"
          if [ -z "$MIN_SDK" ] || [ "$MIN_SDK" -gt 24 ]; then
            echo "APK requires Android newer than 7.0; BlueStacks compatibility check failed." >&2
            exit 1
          fi

          ABIS="$(unzip -Z1 SOHR.apk | sed -n 's#^lib/\\([^/]*\\)/.*#\\1#p' | sort -u)"
          echo "Native ABIs:"
          printf '%s\n' "$ABIS"

          if [ -n "$ABIS" ] && ! printf '%s\n' "$ABIS" | grep -qx "x86_64"; then
            echo "APK has native libraries but no x86_64 ABI for BlueStacks/emulators." >&2
            exit 1
          fi

      - name: Audit release manifest
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump permissions SOHR.apk | tee /tmp/sohr-permissions.txt
          grep -q "android.permission.INTERNET" /tmp/sohr-permissions.txt
          grep -q "android.permission.POST_NOTIFICATIONS" /tmp/sohr-permissions.txt
          if grep -E "READ_SMS|SEND_SMS|READ_CONTACTS|WRITE_CONTACTS|RECORD_AUDIO|CAMERA|ACCESS_FINE_LOCATION|QUERY_ALL_PACKAGES" /tmp/sohr-permissions.txt; then
            echo "Unexpected sensitive permission found in SOHR release" >&2
            exit 1
          fi

      - name: Verify SOHR 6.0 UI assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          checks = {
              "native/app/src/main/java/com/unknokable/videosohranenki/ThemePalette.kt": [
                  '"magenta"', '"sunset"', '"ocean"', '"ice"', '"mint"',
                  '"rose"', '"amber"', '"lime"', '"aqua"', '"indigo"', '"crimson"',
                  '"electric"', '"emerald"', '"gold"', '"coral"', '"lavender"', '"ruby"'
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/SettingsScreen.kt": [
                  "private fun appearanceSelector", "showAppearancePicker", "AppThemes.Presets"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/DayCollectionAdapter.kt": [
                  "R.drawable.ic_chevron_right"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/ModernDialogs.kt": [
                  "R.drawable.ic_close", "R.drawable.ic_check", "fun showAppearancePicker"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/LoadingWaveView.kt": [
                  "LinearGradient", "syncAnimator", "PathMeasure", "movingPath"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/SohrBottomNavView.kt": [
                  "requestLocked", "syncSelected"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/HomeVideoShelfAdapter.kt": [
                  "lastPlayedAtFor", "24L * 60L * 60L * 1000L"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/PlayerScreen.kt": [
                  "R.drawable.ic_player_settings"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/TwitchPlayerScreen.kt": [
                  "R.drawable.ic_replay_10", "R.drawable.ic_forward_10", "R.drawable.ic_player_settings"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/TwitchLivePlayerScreen.kt": [
                  "R.drawable.ic_player_settings"
              ],
          }

          for file_name, needles in checks.items():
              text = Path(file_name).read_text(encoding="utf-8")
              missing = [needle for needle in needles if needle not in text]
              if missing:
                  raise SystemExit(f"{file_name}: missing {missing}")

          splash = Path("native/app/src/main/res/values-v31/styles.xml")
          if not splash.is_file() or "windowSplashScreenAnimatedIcon" not in splash.read_text(encoding="utf-8"):
              raise SystemExit("Android 12 splash override missing")

          icon = Path("native/app/src/main/res/drawable-nodpi/ic_launcher.webp")
          if not icon.is_file() or icon.stat().st_size < 4096:
              raise SystemExit(f"SOHR launcher asset missing or too small: {icon}")

          print(f"SOHR 6 UI assets verified; launcher={icon.stat().st_size} bytes")
          PY

      - name: Enable KVM for x86_64 smoke test
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: BlueStacks-like x86_64 smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 25
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            adb logcat -c
            adb install -r SOHR.apk
            adb shell am start -W -n com.unknokable.videosohranenki/.MainActivity
            sleep 6
            adb shell pidof com.unknokable.videosohranenki | grep -Eq '[0-9]+'
            adb logcat -d -t 500 > /tmp/sohr-logcat.txt
            grep -Eqi 'UnsatisfiedLinkError|dlopen failed|cannot locate symbol|FATAL EXCEPTION.*unknokable|Process: com\\.unknokable\\.videosohranenki.*FATAL' /tmp/sohr-logcat.txt && { echo "SOHR/TDLib native compatibility failed on Android 7.1 x86_64" >&2; tail -250 /tmp/sohr-logcat.txt >&2; exit 1; } || true
            echo "SOHR + native libraries launched successfully on Android 7.1 x86_64"

      - name: BlueStacks Nougat x86 smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 25
          arch: x86
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            adb install -r SOHR.apk
            adb shell am start -W -n com.unknokable.videosohranenki/.MainActivity
            sleep 4
            adb shell pidof com.unknokable.videosohranenki | grep -Eq '[0-9]+'
            echo "SOHR launched successfully on Android 7.1 x86 emulator"

      - name: Generate updater manifest
        shell: bash
        run: |
          SHA256=$(sha256sum SOHR.apk | awk '{print $1}')
          cat > update.json <<EOF
          {
            "versionCode": $SOHR_BUILD_NUMBER,
            "versionName": "$SOHR_VERSION_NAME",
            "downloadUrl": "https://github.com/$GITHUB_REPOSITORY/releases/download/sohr-latest/$SOHR_APK_ASSET",
            "sha256": "$SHA256",
            "notes": "SOHR 6.0.3 • stable bottom navigation • scroll-safe appearance • 18 palettes • unclipped dialogs • smarter NEW badge • refined S loader and player icons • BlueStacks verified"
          }
          EOF
          cat update.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOHR-${{ github.run_number }}
          path: |
            SOHR.apk
            ${{ env.SOHR_APK_ASSET }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish updater channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view sohr-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload sohr-latest "$SOHR_APK_ASSET" SOHR.apk update.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create sohr-latest "$SOHR_APK_ASSET" SOHR.apk update.json \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SOHR Latest" \
              --notes "Автоматический канал обновлений SOHR." \
              --prerelease
          fi


      - name: Verify published updater channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf verify-release
          mkdir verify-release
          cd verify-release

          gh release download sohr-latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "update.json" \
            --pattern "$SOHR_APK_ASSET"

          TEST_CODE="$(python3 -c 'import json; print(json.load(open("update.json"))["versionCode"])')"
          TEST_NAME="$(python3 -c 'import json; print(json.load(open("update.json"))["versionName"])')"
          TEST_URL="$(python3 -c 'import json; print(json.load(open("update.json"))["downloadUrl"])')"
          EXPECTED_SHA="$(python3 -c 'import json; print(json.load(open("update.json"))["sha256"])')"
          ACTUAL_SHA="$(sha256sum "$SOHR_APK_ASSET" | awk '{print $1}')"

          test "$TEST_CODE" = "$SOHR_BUILD_NUMBER"
          test "$TEST_NAME" = "$SOHR_VERSION_NAME"
          echo "$TEST_URL" | grep -Fq "/$SOHR_APK_ASSET"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"

          echo "Updater verified: $SOHR_VERSION_NAME ($SOHR_BUILD_NUMBER)"
          echo "Asset: $SOHR_APK_ASSET"
          echo "SHA-256: $ACTUAL_SHA"
