          for required in [
              'background = rounded("#260A0810", 8)',
              "LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(20))",
              'playPause = iconButton(R.drawable.ic_play, "#96100E16", 44)',
              "SohrTimeBar(activity, palette.accent)",
              "bottomMargin = dp(4)"
          ]:
              if required not in player:
                  raise SystemExit(f"SOHR 6.3.6 player chrome/accent regression: {required}")

          for required in [
              "private var settingsDialog: BottomSheetDialog? = null",
              "settingsDialog?.dismiss()",
              "handler.removeCallbacks(autoHideControls)",
              "dismissFullscreenSettings(animated = false)"
          ]:
              if required not in player:
                  raise SystemExit(f"SOHR 6.6.3 player settings regression: {required}")

          telegram_stream = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/TelegramStreamServer.kt"
          ).read_text(encoding="utf-8")
          for required in [
              "startupWindow = 256L * 1024L",
              "backgroundWindow = 4L * 1024L * 1024L",
              "throw IOException",
              "Telegram range is not ready",
              "fun prefetchFraction"
          ]:
              if required not in telegram_stream:
                  raise SystemExit(f"Telegram playback hardening missing: {required}")
          if "DeleteFile(item.fileId)" in telegram_stream:
              raise SystemExit("Telegram playback regression: release deletes reusable video bytes")

          for required in [
              "TelegramDownloadCoordinator",
              "ConcurrentHashMap<Int, Mutex>",
              "suspend fun downloadFully",
              "withFile(item.fileId)",
              "withFile(fileId)"
          ]:
              if required not in telegram_stream:
                  raise SystemExit(f"SOHR 6.3.2 coordinated-download regression: {required}")
          if "CancelDownloadFile(item.fileId" in telegram_stream:
              raise SystemExit("SOHR 6.3.2 regression: player release cancels manual download")

          for required in [
              "TdApi.AddFileToDownloads(",
              "TdApi.RemoveFileFromDownloads(item.fileId, false)",
              "delay(250L)",
              "item.chatId != 0L",
              "TdApi.DownloadFile(item.fileId, 32, 0, 0, true)"
          ]:
              if required not in telegram_stream:
                  raise SystemExit(f"SOHR 6.3.3 independent-download regression: {required}")

          video_item = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/VideoItem.kt"
          ).read_text(encoding="utf-8")
          video_cache = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/SohrVideoCache.kt"
          ).read_text(encoding="utf-8")
          if "val chatId: Long = 0L" not in video_item:
              raise SystemExit("SOHR 6.3.3 VideoItem chatId regression")
          for required in ['chatId = o.optLong("chatId", 0L)', 'put("chatId", item.chatId)']:
              if required not in video_cache:
                  raise SystemExit(f"SOHR 6.3.3 cached chatId regression: {required}")

          smart_download_icon = Path(
              "native/app/src/main/res/drawable/ic_setting_smart_download.xml"
          ).read_text(encoding="utf-8")
          update_icon = Path(
              "native/app/src/main/res/drawable/ic_setting_update.xml"
          ).read_text(encoding="utf-8")
          if smart_download_icon == update_icon:
              raise SystemExit("SOHR 6.3.3 smart-download icon duplicates update icon")
          for required in [
              "M7.1,18.3H16.6",
              "M13.2,9.6L9.9,13.8",
              "L15.3,12.4H12.9"
          ]:
              if required not in smart_download_icon:
                  raise SystemExit(f"SOHR 6.6.3 smart-download glyph regression: {required}")

          for required in [
              "playbackRecoveryAttempts",
              "recoverFromPlaybackError",
              "error.errorCode in 2000..3999"
          ]:
              if required not in player:
                  raise SystemExit(f"Player recovery hardening missing: {required}")

          telegram_main = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/MainActivity.kt"
          ).read_text(encoding="utf-8")
          telegram_required = [
              "telegramAutoRefreshIntervalMs = 15_000L",
              "TdApi.OpenChat(chat.id)",
              "consecutiveOldPages",
              "cachedBeforeRefresh",
              "is TdApi.MessageAnimation",
              "scheduleFeedAutoRefresh(delayMs = 2_000L, force = false)",
              "loadVideos(inPlace = true, quiet = true)",
              "private fun loadVideos(inPlace: Boolean = false, quiet: Boolean = false)"
          ]
          for required in telegram_required:
              if required not in telegram_main:
                  raise SystemExit(f"Telegram refresh hardening missing: {required}")

          sync_script = Path("scripts/sync-videos.js").read_text(encoding="utf-8")
          for required in [
              "Keeping the previous catalog",
              "stableVideos(previous.videos)",
              "Catalog is already current"
          ]:
              if required not in sync_script:
                  raise SystemExit(f"Telegram sync safety missing: {required}")

          dialogs = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/ModernDialogs.kt"
          ).read_text(encoding="utf-8")
          if "chunked(3)" not in dialogs or "dp(context, 96)" not in dialogs:
              raise SystemExit("Appearance palette readability regression")
          for required in [
              "val overlay = FrameLayout(context)",
              "FrameLayout.LayoutParams(",
              "Gravity.CENTER",
              "ViewGroup.LayoutParams.MATCH_PARENT",
              "windowAnimations = 0",
              "box.visibility = View.VISIBLE",
              "box.alpha = 1f",
              "overlay.addOnLayoutChangeListener"
          ]:
              if required not in dialogs:
                  raise SystemExit(f"SOHR 6.7.7 first-frame dialog regression: {required}")
          for forbidden in [
              "box.visibility = View.INVISIBLE",
              "stablePasses >=",
              "box.postDelayed({"
          ]:
              if forbidden in dialogs:
                  raise SystemExit(f"SOHR 6.7.7 delayed-dialog regression: {forbidden}")
          if "LinearLayout.LayoutParams(dp(context, 38), dp(context, 4))" in dialogs:
              raise SystemExit("Legacy dialog top handle regression")

          if "BitmapFactory.decodeFile" in player:
              raise SystemExit("Synchronous thumbnail decoding regression")

          for required in [
              ".setForceHighestSupportedBitrate(true)",
              '"Лучшее • максимальный битрейт"',
              '"Авто • адаптивное качество"',
              ".setForceHighestSupportedBitrate(false)"
          ]:
              if required not in player:
                  raise SystemExit(f"SOHR 6.6.10 Media3 highest-bitrate regression: {required}")
          if '"Авто • лучшее доступное"' in player:
              raise SystemExit("SOHR 6.6.10 regression: adaptive Auto is mislabeled as best")

          twitch_player = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/TwitchPlayerScreen.kt"
          ).read_text(encoding="utf-8")
          if "dp(300)" in twitch_player:
              raise SystemExit("Fixed-height Twitch player regression")
          for required in ["availableWidth", "showPlayerSettings()", "9f / 16f"]:
              if required not in twitch_player:
                  raise SystemExit(f"Adaptive Twitch player UI missing: {required}")
          if "topMargin = dp(2)" in twitch_player:
              raise SystemExit("SOHR 6.3.4 Twitch player regression: header gap returned")


          splash = Path("native/app/src/main/res/values-v31/styles.xml")
          if not splash.is_file():
              raise SystemExit("Android 12 splash override missing")

          v31_styles = splash.read_text(encoding="utf-8")
          for required in [
              "@drawable/splash_empty",
              "<item name=\"windowSplashScreenAnimationDuration\">0</item>",
              "<item name=\"windowSplashScreenBackground\">#08070D</item>"
          ]:
              if required not in v31_styles:
                  raise SystemExit(f"SOHR 6.2.8 Android 12 blank splash regression: {required}")
          if "@drawable/sohr_splash_mark" in v31_styles:
              raise SystemExit("SOHR 6.2.8 regression: static Android 12 splash logo returned")

          obsolete_splash = Path("native/app/src/main/res/drawable/sohr_splash_mark.xml")
          if obsolete_splash.exists():
              raise SystemExit("SOHR 6.2.8 regression: obsolete static splash mark file returned")

          icon = Path("native/app/src/main/res/drawable-nodpi/sohr_brand_logo_v3.webp")
          if not icon.is_file() or icon.stat().st_size < 4096:
              raise SystemExit(f"SOHR 6.3.4 launcher asset missing or too small: {icon}")

          print(f"SOHR 6 UI assets verified; launcher={icon.stat().st_size} bytes")
          PY

      - name: Generate updater manifest
        shell: bash
        run: |
          SHA256=$(sha256sum SOHR.apk | awk '{print $1}')
          cat > update.json <<EOF
          {
            "versionCode": $SOHR_BUILD_NUMBER,
            "versionName": "$SOHR_VERSION_NAME",
            "downloadUrl": "https://github.com/$GITHUB_REPOSITORY/releases/download/sohr-latest/$SOHR_APK_ASSET",
            "sha256": "$SHA256",
            "notes": "SOHR 6.9.37 • пять иллюстраций onboarding взяты непосредственно из утверждённого пользователем оригинального превью, без перерисовки и самодельных векторов • высококачественные изображения воспроизводятся на экране с точными пропорциями и плавной сменой без морфинга • целостность графических ресурсов проверяется по SHA-256 при сборке"
          }
          EOF
          cat update.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOHR-${{ github.run_number }}
          path: |
            SOHR.apk
            ${{ env.SOHR_APK_ASSET }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish updater channel
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view sohr-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload sohr-latest "$SOHR_APK_ASSET" SOHR.apk update.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create sohr-latest "$SOHR_APK_ASSET" SOHR.apk update.json \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SOHR Latest" \
              --notes "Автоматический канал обновлений SOHR." \
              --prerelease
          fi


      - name: Keep only three SOHR versions
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # One clean release channel: remove the obsolete old test release.
          if gh release view sohr-test-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete sohr-test-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
          fi

          # Keep generic updater files and only the three newest numbered APKs.
          mapfile -t VERSIONED_APKS < <(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/sohr-latest" \
              --jq '.assets[].name' \
              | grep -E '^SOHR-[0-9]+\.apk$' \
              | sort -V
          )

          COUNT="${#VERSIONED_APKS[@]}"
          if [ "$COUNT" -gt 3 ]; then
            DELETE_COUNT=$((COUNT - 3))
            for ((i=0; i<DELETE_COUNT; i++)); do
              ASSET="${VERSIONED_APKS[$i]}"
              echo "Deleting old SOHR asset: $ASSET"
              gh release delete-asset sohr-latest "$ASSET" --yes --repo "$GITHUB_REPOSITORY"
            done
          fi

          LEFT=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/sohr-latest" \
            --jq '[.assets[].name | select(test("^SOHR-[0-9]+\\.apk$"))] | length')
          if [ "$LEFT" -gt 3 ]; then
            echo "Release retention failed: $LEFT versioned APKs remain" >&2
            exit 1
          fi

      - name: Verify published updater channel
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf verify-release
          mkdir verify-release
          cd verify-release

          gh release download sohr-latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "update.json" \
            --pattern "$SOHR_APK_ASSET"

          TEST_CODE="$(python3 -c 'import json; print(json.load(open("update.json"))["versionCode"])')"
          TEST_NAME="$(python3 -c 'import json; print(json.load(open("update.json"))["versionName"])')"
          TEST_URL="$(python3 -c 'import json; print(json.load(open("update.json"))["downloadUrl"])')"
          EXPECTED_SHA="$(python3 -c 'import json; print(json.load(open("update.json"))["sha256"])')"
          ACTUAL_SHA="$(sha256sum "$SOHR_APK_ASSET" | awk '{print $1}')"

          test "$TEST_CODE" = "$SOHR_BUILD_NUMBER"
          test "$TEST_NAME" = "$SOHR_VERSION_NAME"
          echo "$TEST_URL" | grep -Fq "/$SOHR_APK_ASSET"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"

          echo "Updater verified: $SOHR_VERSION_NAME ($SOHR_BUILD_NUMBER)"
          echo "Asset: $SOHR_APK_ASSET"
          echo "SHA-256: $ACTUAL_SHA"
