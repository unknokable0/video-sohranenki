name: Build Android APK

# SOHR 6.3.0: moments, precise seek, Streak 2.0, sessions, smart downloads and standalone Recap
# Rebuild marker: test34 runner restart
# Final release trigger: SOHR 6.0.15 playback fix
on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sohr-build-main-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      SOHR_KEYSTORE_B64: ${{ secrets.SOHR_KEYSTORE_B64 }}
      SOHR_KEYSTORE_PASSWORD: ${{ secrets.SOHR_KEYSTORE_PASSWORD }}
      SOHR_KEY_ALIAS: ${{ secrets.SOHR_KEY_ALIAS }}
      SOHR_KEY_PASSWORD: ${{ secrets.SOHR_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Assign SOHR 6.3.0 version
        shell: bash
        run: |
          echo "SOHR_BUILD_NUMBER=630000" >> "$GITHUB_ENV"
          echo "SOHR_VERSION_NAME=6.3.0" >> "$GITHUB_ENV"

      - name: Verify Twitch OAuth authorize endpoint
        shell: bash
        run: |
          CLIENT_ID="${TWITCH_CLIENT_ID:-gnr3cikerodr25wpbrb04a11031qiz}"
          REDIRECT="https://unknokable0.github.io/video-sohranenki/twitch-auth/"
          URL="https://id.twitch.tv/oauth2/authorize?response_type=token&client_id=$CLIENT_ID&redirect_uri=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("'"$REDIRECT"'", safe=""))')&scope=chat%3Aread%20chat%3Aedit&state=sohr-build-check"
          CODE="$(curl --silent --show-error --location --max-time 20 --output /tmp/twitch-oauth.html --write-out '%{http_code}' "$URL" || true)"
          if [ "$CODE" -ge 400 ] || [ "$CODE" -lt 200 ]; then
            echo "Twitch OAuth authorize endpoint failed with HTTP $CODE" >&2
            cat /tmp/twitch-oauth.html >&2 || true
            exit 1
          fi
          if grep -Eqi 'invalid redirect|redirect uri.*invalid|invalid client' /tmp/twitch-oauth.html; then
            echo "Twitch rejected OAuth client or redirect URI" >&2
            cat /tmp/twitch-oauth.html >&2
            exit 1
          fi
          echo "Twitch OAuth authorize endpoint reachable (HTTP $CODE)"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          : "${SOHR_KEYSTORE_B64:?SOHR release keystore is required}"
          : "${SOHR_KEYSTORE_PASSWORD:?SOHR keystore password is required}"
          : "${SOHR_KEY_ALIAS:?SOHR key alias is required}"
          : "${SOHR_KEY_PASSWORD:?SOHR key password is required}"

          printf '%s' "$SOHR_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/native/sohr-release.jks"
          SOHR_KEYSTORE_PATH="$GITHUB_WORKSPACE/native/sohr-release.jks"           SOHR_KEYSTORE_PASSWORD="$SOHR_KEYSTORE_PASSWORD"           SOHR_KEY_ALIAS="$SOHR_KEY_ALIAS"           SOHR_KEY_PASSWORD="$SOHR_KEY_PASSWORD"             gradle -p native :app:assembleRelease --no-daemon --stacktrace

          cp native/app/build/outputs/apk/release/app-release.apk SOHR.apk

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs SOHR.apk | tee /tmp/sohr-signing.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/sohr-signing.txt

          APK_ASSET="SOHR-${SOHR_BUILD_NUMBER}.apk"
          cp SOHR.apk "$APK_ASSET"
          echo "SOHR_APK_ASSET=$APK_ASSET" >> "$GITHUB_ENV"

      - name: Verify APK metadata
        shell: bash
        run: |
          set -euo pipefail

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$AAPT"
          "$AAPT" dump badging SOHR.apk | tee /tmp/sohr-badging.txt
          grep -q "package: name='com.unknokable.videosohranenki'" /tmp/sohr-badging.txt
          grep -q "launchable-activity: name='com.unknokable.videosohranenki.MainActivity'" /tmp/sohr-badging.txt

      - name: Audit release manifest
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump permissions SOHR.apk | tee /tmp/sohr-permissions.txt
          grep -q "android.permission.INTERNET" /tmp/sohr-permissions.txt
          grep -q "android.permission.POST_NOTIFICATIONS" /tmp/sohr-permissions.txt
          if grep -E "READ_SMS|SEND_SMS|READ_CONTACTS|WRITE_CONTACTS|RECORD_AUDIO|CAMERA|ACCESS_FINE_LOCATION|QUERY_ALL_PACKAGES" /tmp/sohr-permissions.txt; then
            echo "Unexpected sensitive permission found in SOHR release" >&2
            exit 1
          fi

      - name: Verify SOHR 6.0 UI assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_root = Path("native/app/src/main")
          informal = re.compile(
              r"(?<![А-Яа-яЁёІіЇїЄєҐґ])"
              r"(ты|тебя|тебе|тобой|твой|твоя|твоё|твое|твои|твоих|твоей|"
              r"продолжай|нажми|посмотри|выбери|введи|проверь|попробуй|"
              r"подключи|войди|открой|скачай|добавь|удали|перейди|разреши|"
              r"подтверди|верни|обнови|обери|перевір)"
              r"(?![А-Яа-яЁёІіЇїЄєҐґ])",
              re.IGNORECASE,
          )
          for source in source_root.rglob("*"):
              if source.suffix not in {".kt", ".xml"}:
                  continue
              text = source.read_text(encoding="utf-8")
              for line_no, line in enumerate(text.splitlines(), start=1):
                  if '"' in line and informal.search(line):
                      raise SystemExit(
                          f"Informal user address found: {source}:{line_no}: {line.strip()}"
                      )

          checks = {
              "native/app/src/main/java/com/unknokable/videosohranenki/ThemePalette.kt": [
                  '"magenta"', '"sunset"', '"ocean"', '"ice"', '"mint"',
                  '"rose"', '"amber"', '"lime"', '"aqua"', '"indigo"', '"crimson"',
                  '"electric"', '"emerald"', '"gold"', '"coral"', '"lavender"', '"ruby"'
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/SettingsScreen.kt": [
                  "private fun appearanceSelector", "showAppearancePicker", "AppThemes.Presets"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/DayCollectionAdapter.kt": [
                  "R.drawable.ic_chevron_right"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/ModernDialogs.kt": [
                  "R.drawable.ic_close", "R.drawable.ic_check", "fun showAppearancePicker"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/LoadingWaveView.kt": [
                  "syncAnimator", "outlinePath", "segmentPath", "PathMeasure", "segmentPaint", "duration = 1850L"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/SohrBottomNavView.kt": [
                  "syncSelected", "private fun requestIndex(target: Int)"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/HomeVideoShelfAdapter.kt": [
                  "lastPlayedAtFor", "24L * 60L * 60L * 1000L"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/PlayerScreen.kt": [
                  "R.drawable.ic_player_settings"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/TwitchPlayerScreen.kt": [
                  "R.drawable.ic_replay_10", "R.drawable.ic_forward_10", "R.drawable.ic_player_settings"
              ],
              "native/app/src/main/java/com/unknokable/videosohranenki/TwitchLivePlayerScreen.kt": [
                  "R.drawable.ic_player_settings"
              ],
          }

          for file_name, needles in checks.items():
              text = Path(file_name).read_text(encoding="utf-8")
              missing = [needle for needle in needles if needle not in text]
              if missing:
                  raise SystemExit(f"{file_name}: missing {missing}")

          loader = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/LoadingWaveView.kt"
          ).read_text(encoding="utf-8")
          forbidden_loader_patterns = ["segmentGlowPaint", "headPaint", "drawCircle("]
          found_loader_forbidden = [p for p in forbidden_loader_patterns if p in loader]
          if found_loader_forbidden:
              raise SystemExit(
                  f"Loader glow/head regression detected: {found_loader_forbidden}"
              )

          player = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/PlayerScreen.kt"
          ).read_text(encoding="utf-8")
          forbidden_player_patterns = [
              "forceEnableMediaCodecAsynchronousQueueing",
              "setCompoundDrawablesRelative(",
              "setCompoundDrawablesRelativeWithIntrinsicBounds("
          ]
          found_forbidden = [p for p in forbidden_player_patterns if p in player]
          if found_forbidden:
              raise SystemExit(
                  f"Unsafe player regression detected: {found_forbidden}"
              )
          for required in ["PlayerActionPill", "setActionIconSafely", "ExoPlayer.Builder(activity)"]:
              if required not in player:
                  raise SystemExit(f"Player hardening missing: {required}")

          sohr_main = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/MainActivity.kt"
          ).read_text(encoding="utf-8")
          for required in [
              "buildTodayCard",
              "R.drawable.ic_search",
              "showVideoQuickActions",
              "showFeedSkeleton",
              "handleOnBackProgressed",
              "prepareForPictureInPicture"
          ]:
              if required not in sohr_main:
                  raise SystemExit(f"SOHR 6.1 home/PiP feature missing: {required}")

          player = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/PlayerScreen.kt"
          ).read_text(encoding="utf-8")
          for required in [
              "prepareForPictureInPicture",
              "restoreFromPictureInPicture",
              "animateEntranceFrom",
              "ambientGradient"
          ]:
              if required not in player:
                  raise SystemExit(f"SOHR 6.1 player polish missing: {required}")

          manifest = Path("native/app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          if 'android:enableOnBackInvokedCallback="true"' not in manifest:
              raise SystemExit("Predictive Back manifest integration missing")

          home_cards = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/HomeVideoShelfAdapter.kt"
          ).read_text(encoding="utf-8")
          video_cards = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/VideoAdapter.kt"
          ).read_text(encoding="utf-8")
          if "setOnLongClickListener" not in home_cards or "setOnLongClickListener" not in video_cards:
              raise SystemExit("Video long-press actions regression")
          for required in [
              "screenWidth * 0.60f",
              "val blend = View(context)",
              "setDuration(240L)",
              "cornerRadius = dp(context, 18).toFloat()"
          ]:
              if required not in home_cards:
                  raise SystemExit(f"Unified compact home-card regression: {required}")

          bottom_nav = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/SohrBottomNavView.kt"
          ).read_text(encoding="utf-8")
          for required in [
              "if (!animate) positionIndicator(false)",
              "Always forward the tap",
              "ValueAnimator.ofFloat(from, to)"
          ]:
              if required not in bottom_nav:
                  raise SystemExit(f"Bottom navigation animation regression: {required}")

          if "T2x2 • в сети" not in sohr_main or "T2x2 • не в сети" not in sohr_main:
              raise SystemExit("T2x2 live status copy regression")
          if "setStroke(dp(context, 1), palette.stroke)" in home_cards:
              raise SystemExit("Home card outline regression")
          if "compactPreviewHeight + dp(68)" not in sohr_main:
              raise SystemExit("Home card text-height regression")
          for required in [
              "registerSearchBackInterceptor",
              "PRIORITY_OVERLAY",
              "unregisterSearchBackInterceptor"
          ]:
              if required not in sohr_main:
                  raise SystemExit(f"Search back interceptor regression: {required}")

          bottom_nav = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/SohrBottomNavView.kt"
          ).read_text(encoding="utf-8")
          if "setOnTouchListener" in bottom_nav:
              raise SystemExit("Bottom navigation touch interception regression")
          if "requestLocked" in bottom_nav:
              raise SystemExit("Bottom navigation artificial lock regression")

          experience_store = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/SohrExperienceStore.kt"
          ).read_text(encoding="utf-8")
          for required in [
              "fun beginVisit",
              "fun queueIds",
              "fun addNext",
              "fun addLast"
          ]:
              if required not in experience_store:
                  raise SystemExit(f"SOHR 6.2 experience-store regression: {required}")
          for forbidden in ["SohrMonthlyRecap", "recordWatchTime", "recordPlayStart", "mostActiveDay"]:
              if forbidden in experience_store:
                  raise SystemExit(f"SOHR 6.2.6 removed Recap tracking returned: {forbidden}")

          moments_store = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/SohrMomentsStore.kt"
          ).read_text(encoding="utf-8")
          for required in [
              "data class SohrMoment",
              "fun add(",
              "fun rename(",
              "fun remove("
          ]:
              if required not in moments_store:
                  raise SystemExit(f"SOHR 6.3.0 Moments store regression: {required}")

          recap_store = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/SohrRecapStore.kt"
          ).read_text(encoding="utf-8")
          for required in [
              "data class SohrRecapSnapshot",
              "fun markSessionStart",
              "fun addWatchSlice",
              "fun snapshot"
          ]:
              if required not in recap_store:
                  raise SystemExit(f"SOHR 6.3.0 standalone Recap regression: {required}")

          session_adapter = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/PlaybackSessionAdapter.kt"
          ).read_text(encoding="utf-8")
          for required in ["Collections.swap", "fun move(", "fun ids()"]:
              if required not in session_adapter:
                  raise SystemExit(f"SOHR 6.3.0 playback-session regression: {required}")

          streak_tracker = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/StreakTracker.kt"
          ).read_text(encoding="utf-8")
          for required in [
              "fun protectionTokens",
              "fun protectedDays",
              "ensureProtection",
              "MAX_PROTECTION_TOKENS = 2"
          ]:
              if required not in streak_tracker:
                  raise SystemExit(f"SOHR 6.3.0 streak protection regression: {required}")

          download_store = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/SohrDownloadStore.kt"
          ).read_text(encoding="utf-8")
          for required in ["SohrDownloadEntry", "fun register", "fun remove", "fun totalBytes"]:
              if required not in download_store:
                  raise SystemExit(f"SOHR 6.2 download-center regression: {required}")

          for required in ["autoManaged", "fun autoEntries"]:
              if required not in download_store:
                  raise SystemExit(f"SOHR 6.3.0 smart-download store regression: {required}")

          motion = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/SohrMotion.kt"
          ).read_text(encoding="utf-8")
          for required in ["const val FAST", "const val NORMAL", "const val HERO", "object SohrHaptics"]:
              if required not in motion:
                  raise SystemExit(f"SOHR 6.2 motion regression: {required}")

          media_session = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/SohrMediaSessionBridge.kt"
          ).read_text(encoding="utf-8")
          for required in ["MediaSession.Builder", "MediaMetadata.Builder", "T2x2 • SOHR"]:
              if required not in media_session:
                  raise SystemExit(f"SOHR 6.2 MediaSession regression: {required}")

          settings_screen = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/SettingsScreen.kt"
          ).read_text(encoding="utf-8")
          for required in ["previewModeSelector", '"Wi‑Fi"', '"Всегда"', '"Выкл"']:
              if required not in settings_screen:
                  raise SystemExit(f"SOHR 6.2 preview-setting regression: {required}")

          app_settings = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/AppSettings.kt"
          ).read_text(encoding="utf-8")
          if "var previewMode: String" not in app_settings:
              raise SystemExit("SOHR 6.2 preview-mode persistence regression")

          if "var smartDownloads: Boolean" not in app_settings:
              raise SystemExit("SOHR 6.3.0 smart-download setting regression")

          for required in [
              "nav.translationY = 0f",
              "nav.alpha = 1f",
              'else -> unwatchedVideos.size.toString() + " новых"',
              'contentDescription = "Назад"'
          ]:
              if required not in sohr_main:
                  raise SystemExit(f"SOHR 6.2.6 stable-nav/UI regression: {required}")
          if ".translationY(dp(30).toFloat())" in sohr_main:
              raise SystemExit("SOHR 6.2.6 regression: bottom navigation moves during feed scroll")

          for required in [
              "fun modeLabel(mode: String)",
              "ModernDialogs.showChoices",
              '"Тихое превью • " + modeLabel(settings.previewMode)'
          ]:
              if required not in settings_screen:
                  raise SystemExit(f"SOHR 6.2.1 compact preview-setting regression: {required}")

          for required in [
              'title = "Моменты"',
              'title = "SOHR Recap"',
              'title = "Умное скачивание"'
          ]:
              if required not in settings_screen:
                  raise SystemExit(f"SOHR 6.3.0 selected-settings regression: {required}")

          preview_pos = settings_screen.find("root.addView(previewModeSelector())")
          autoplay_pos = settings_screen.find('title = "Автовоспроизведение"')
          if preview_pos < 0 or autoplay_pos < 0 or preview_pos > autoplay_pos:
              raise SystemExit("SOHR 6.2.2 settings order regression: preview must be above autoplay")

          for required in ["cachedEntries", "@Volatile private var cachedEntries"]:
              if required not in download_store:
                  raise SystemExit(f"SOHR 6.2.2 download cache regression: {required}")

          for required in ["queueCache", "@Volatile private var queueCache"]:
              if required not in experience_store:
                  raise SystemExit(f"SOHR 6.2.2 queue cache regression: {required}")

          for required in [
              "withContext(Dispatchers.IO) { videoCache.load() }",
              "val cachedById = cachedBeforeRefresh.associateBy",
              "withContext(Dispatchers.IO) {\n                    videoCache.save(preparedVideos)",
              "setHasFixedSize(true)",
              "setItemViewCacheSize(5)"
          ]:
              if required not in sohr_main:
                  raise SystemExit(f"SOHR 6.2.2 main-thread/perf regression: {required}")

          for required in ["lastClickAtMs", "SystemClock.elapsedRealtime()", "SohrMotion.FAST"]:
              if required not in home_cards:
                  raise SystemExit(f"SOHR 6.2.2 home-card responsiveness regression: {required}")
          if "holder.itemView.isEnabled = false" in home_cards or "holder.itemView.postDelayed" in home_cards:
              raise SystemExit("SOHR 6.2.2 recycled-card regression: click path disables/re-enables itemView")

          for required in [
              '"Запись стрима T2x2"',
              "hasTelegramPromo",
              "playerCard.scaleX = 0.94f",
              "playerCard.scaleX = 1.035f",
              ".setDuration(SohrMotion.HERO)"
          ]:
              if required not in player:
                  raise SystemExit(f"SOHR 6.2.3 player/fullscreen polish regression: {required}")

          for required in [
              "if (!feedSearchOpen) return",
              "(searchInput.tag as? Runnable)?.let(searchInput::removeCallbacks)",
              "searchPanel.scaleX = 0.985f",
              "val firstReveal = searchResultsHost.visibility != View.VISIBLE"
          ]:
              if required not in sohr_main:
                  raise SystemExit(f"SOHR 6.2.3 search-motion regression: {required}")

          manifest = Path("native/app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          styles = Path("native/app/src/main/res/values/styles.xml").read_text(encoding="utf-8")
          gradle_file = Path("native/app/build.gradle.kts").read_text(encoding="utf-8")
          brand_file = Path("native/app/src/main/res/drawable-nodpi/sohr_brand_logo.webp")
          loader = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/LoadingWaveView.kt"
          ).read_text(encoding="utf-8")

          if not brand_file.is_file() or brand_file.stat().st_size < 10000:
              raise SystemExit("SOHR 6.2.6 direct brand artwork is missing or too small")
          brand_bytes = brand_file.read_bytes()
          if not brand_bytes.startswith(b"RIFF") or b"WEBP" not in brand_bytes[:16]:
              raise SystemExit("SOHR 6.2.6 brand artwork is not a valid WebP")

          for required in [
              'android:icon="@drawable/sohr_brand_logo"',
              'android:roundIcon="@drawable/sohr_brand_logo"',
              'android:theme="@style/AppTheme.Starting"',
              "android.permission.ACCESS_NETWORK_STATE"
          ]:
              if required not in manifest:
                  raise SystemExit(f"SOHR 6.2.5 manifest branding/network regression: {required}")

          for required in [
              'name="AppTheme.Starting"',
              "windowSplashScreenAnimatedIcon",
              "@drawable/splash_empty",
              "windowSplashScreenAnimationDuration",
              "postSplashScreenTheme"
          ]:
              if required not in styles:
                  raise SystemExit(f"SOHR 6.2.8 blank system splash regression: {required}")
          if "@drawable/sohr_splash_mark" in styles:
              raise SystemExit("SOHR 6.2.8 regression: static launch logo returned to base styles")
          if "<item name=\"windowSplashScreenAnimationDuration\">0</item>" not in styles:
              raise SystemExit("SOHR 6.2.8 regression: system splash duration is not zero")

          if "prepareSohrBrandAssets" in gradle_file or "sohr_brand.webp.hex" in gradle_file:
              raise SystemExit("SOHR 6.2.6 regression: legacy hex brand generation returned")
          if "core-splashscreen:1.2.0" not in gradle_file:
              raise SystemExit("SOHR splash dependency missing")

          for required in [
              "outlinePath",
              "segmentPath",
              "PathMeasure",
              "basePaint",
              "glowPaint",
              "segmentPaint",
              "duration = 1850L",
              "val segmentLength = length * 0.27f"
          ]:
              if required not in loader:
                  raise SystemExit(f"SOHR 6.2.7 classic-loader regression: {required}")
          for forbidden in ["cloudPath", "sCutPath", "PorterDuff.Mode.CLEAR", "LinearGradient("]:
              if forbidden in loader:
                  raise SystemExit(f"SOHR 6.2.7 wrong-loader regression: {forbidden}")

          for required in [
              "installSplashScreen()",
              "buildBrandLoadingMark",
              "friendlyTwitchFailure",
              "isTwitchNetworkFailure",
              "canAttemptTwitchNetwork",
              "twitchNetworkCooldownUntilElapsed",
              "+ 30_000L",
              "WebResourceError",
              "onReceivedError"
          ]:
              if required not in sohr_main:
                  raise SystemExit(f"SOHR 6.2.5 branding/network regression: {required}")

          startup_section = sohr_main.split("private fun showStartupSplash()", 1)[1].split("\n    private fun ", 1)[0]
          brand_loading_section = sohr_main.split("private fun buildBrandLoadingMark", 1)[1].split("\n    private fun ", 1)[0]
          if "sohr_brand_logo" in startup_section or "sohr_brand_logo" in brand_loading_section:
              raise SystemExit("SOHR 6.2.5 loading regression: raster brand artwork returned to loading UI")
          for required in [
              "val loader = LoadingWaveView(this, purple)",
              "LinearLayout.LayoutParams(dp(64), dp(64))",
              "setDuration(300L)"
          ]:
              if required not in startup_section:
                  raise SystemExit(f"SOHR 6.2.7 classic startup-loader regression: {required}")
          if "ImageView(" in startup_section or "sohr_brand_logo" in startup_section:
              raise SystemExit("SOHR 6.2.7 loading regression: image returned to startup loading")

          forbidden_raw_twitch = [
              'Toast.makeText(this@MainActivity, e.message ?: "Ошибка Twitch"',
              '"Unable to resolve host"',
              '"No address associated with hostname"'
          ]
          for forbidden in forbidden_raw_twitch:
              if forbidden in sohr_main and forbidden.startswith("Toast.makeText"):
                  raise SystemExit("SOHR 6.2.5 raw Twitch error Toast regression")

          for required in [
              '"С прошлого раза"',
              "showPlaybackQueue",
              "showDownloadCenter",
              "setupInlinePreviewShelf",
              "liveElapsedLabel",
              "prefetchNextCandidate",
              "fraction = 0.15f"
          ]:
              if required not in sohr_main:
                  raise SystemExit(f"SOHR 6.2 main-experience regression: {required}")

          for required in [
              "showMoments(",
              "showRecap(",
              "scheduleSmartDownloads(",
              "TRANSPORT_WIFI",
              ".take(2)",
              "PlaybackSessionAdapter",
              "ItemTouchHelper",
              "saveRecapCard"
          ]:
              if required not in sohr_main:
                  raise SystemExit(f"SOHR 6.3.0 selected-features regression: {required}")
          for forbidden in ["buildRecapTeaser", "showMonthlyRecap", "experienceStore.recap()"]:
              if forbidden in sohr_main:
                  raise SystemExit(f"SOHR 6.2.6 regression: monthly Recap code returned: {forbidden}")

          for required in [
              "mediaSessionBridge",
              "queueItems",
              "onDownloadRequested"
          ]:
              if required not in player:
                  raise SystemExit(f"SOHR 6.2 player-experience regression: {required}")
          for required in [
              "sampleWatchTime",
              "flushWatchTime",
              "onWatchSlice",
              "onSaveMoment",
              "onOpenMoments",
              "requestFilmstrip",
              "loadPreviewFrame",
              "previewStripImages"
          ]:
              if required not in player:
                  raise SystemExit(f"SOHR 6.3.0 player moments/seek/Recap regression: {required}")

          for required in [
              "TdApi.AddFileToDownloads(",
              "TdApi.GetFile(item.fileId)",
              "TdApi.RemoveFileFromDownloads(item.fileId, false)",
              "activeManualDownloads"
          ]:
              if required not in sohr_main:
                  raise SystemExit(f"SOHR 6.2.6 manual-download regression: {required}")
          if "TdApi.DownloadFile(item.fileId, 1, 0, 0, true)" in sohr_main:
              raise SystemExit("SOHR 6.2.6 regression: manual download uses conflicting DownloadFile")

          time_bar = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/SohrTimeBar.kt"
          ).read_text(encoding="utf-8")
          for required in [
              "val desired = dp(22f).toInt()",
              "dp(if (scrubbing) 3f else 2f)",
              "dp(5.5f)"
          ]:
              if required not in time_bar:
                  raise SystemExit(f"SOHR 6.2.6 compact timeline regression: {required}")

          for required in [
              "onFineScrubMode",
              "touchStartY - event.y > dp(28f)"
          ]:
              if required not in time_bar:
                  raise SystemExit(f"SOHR 6.3.0 fine-scrub regression: {required}")
          for required in [
              'background = rounded("#480A0810", 12)',
              "LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(18))"
          ]:
              if required not in player:
                  raise SystemExit(f"SOHR 6.2.6 compact player chrome regression: {required}")

          telegram_stream = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/TelegramStreamServer.kt"
          ).read_text(encoding="utf-8")
          for required in [
              "startupWindow = 256L * 1024L",
              "backgroundWindow = 4L * 1024L * 1024L",
              "throw IOException",
              "Telegram range is not ready",
              "fun prefetchFraction"
          ]:
              if required not in telegram_stream:
                  raise SystemExit(f"Telegram playback hardening missing: {required}")
          if "DeleteFile(item.fileId)" in telegram_stream:
              raise SystemExit("Telegram playback regression: release deletes reusable video bytes")

          for required in [
              "playbackRecoveryAttempts",
              "recoverFromPlaybackError",
              "error.errorCode in 2000..3999"
          ]:
              if required not in player:
                  raise SystemExit(f"Player recovery hardening missing: {required}")

          telegram_main = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/MainActivity.kt"
          ).read_text(encoding="utf-8")
          telegram_required = [
              "telegramAutoRefreshIntervalMs = 15_000L",
              "TdApi.OpenChat(chat.id)",
              "consecutiveOldPages",
              "cachedBeforeRefresh",
              "is TdApi.MessageAnimation",
              "scheduleFeedAutoRefresh(delayMs = 2_000L, force = false)",
              "loadVideos(inPlace = true, quiet = true)",
              "private fun loadVideos(inPlace: Boolean = false, quiet: Boolean = false)"
          ]
          for required in telegram_required:
              if required not in telegram_main:
                  raise SystemExit(f"Telegram refresh hardening missing: {required}")

          sync_script = Path("scripts/sync-videos.js").read_text(encoding="utf-8")
          for required in [
              "Keeping the previous catalog",
              "stableVideos(previous.videos)",
              "Catalog is already current"
          ]:
              if required not in sync_script:
                  raise SystemExit(f"Telegram sync safety missing: {required}")

          dialogs = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/ModernDialogs.kt"
          ).read_text(encoding="utf-8")
          if "chunked(3)" not in dialogs or "dp(context, 96)" not in dialogs:
              raise SystemExit("Appearance palette readability regression")
          if "LinearLayout.LayoutParams(dp(context, 38), dp(context, 4))" in dialogs:
              raise SystemExit("Legacy dialog top handle regression")

          if "BitmapFactory.decodeFile" in player:
              raise SystemExit("Synchronous thumbnail decoding regression")

          twitch_player = Path(
              "native/app/src/main/java/com/unknokable/videosohranenki/TwitchPlayerScreen.kt"
          ).read_text(encoding="utf-8")
          if "dp(300)" in twitch_player:
              raise SystemExit("Fixed-height Twitch player regression")
          for required in ["availableWidth", "showPlayerSettings()", "9f / 16f"]:
              if required not in twitch_player:
                  raise SystemExit(f"Adaptive Twitch player UI missing: {required}")

          splash = Path("native/app/src/main/res/values-v31/styles.xml")
          if not splash.is_file():
              raise SystemExit("Android 12 splash override missing")

          v31_styles = splash.read_text(encoding="utf-8")
          for required in [
              "@drawable/splash_empty",
              "<item name=\"windowSplashScreenAnimationDuration\">0</item>",
              "<item name=\"windowSplashScreenBackground\">#08070D</item>"
          ]:
              if required not in v31_styles:
                  raise SystemExit(f"SOHR 6.2.8 Android 12 blank splash regression: {required}")
          if "@drawable/sohr_splash_mark" in v31_styles:
              raise SystemExit("SOHR 6.2.8 regression: static Android 12 splash logo returned")

          obsolete_splash = Path("native/app/src/main/res/drawable/sohr_splash_mark.xml")
          if obsolete_splash.exists():
              raise SystemExit("SOHR 6.2.8 regression: obsolete static splash mark file returned")

          icon = Path("native/app/src/main/res/drawable-nodpi/sohr_brand_logo.webp")
          if not icon.is_file() or icon.stat().st_size < 10000:
              raise SystemExit(f"SOHR 6.2.6 launcher asset missing or too small: {icon}")

          print(f"SOHR 6 UI assets verified; launcher={icon.stat().st_size} bytes")
          PY

      - name: Generate updater manifest
        shell: bash
        run: |
          SHA256=$(sha256sum SOHR.apk | awk '{print $1}')
          cat > update.json <<EOF
          {
            "versionCode": $SOHR_BUILD_NUMBER,
            "versionName": "$SOHR_VERSION_NAME",
            "downloadUrl": "https://github.com/$GITHUB_REPOSITORY/releases/download/sohr-latest/$SOHR_APK_ASSET",
            "sha256": "$SHA256",
            "notes": "Моменты с переходом на точную секунду • точная перемотка с лентой кадров • Streak 2.0 с защитными щитами • drag-and-drop сессия просмотра • умное скачивание 2 свежих видео только по Wi‑Fi • отдельный SOHR Recap с сохранением PNG • новая синяя ава приложения • старая облачная загрузка без изменений"
          }
          EOF
          cat update.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOHR-${{ github.run_number }}
          path: |
            SOHR.apk
            ${{ env.SOHR_APK_ASSET }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish updater channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view sohr-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload sohr-latest "$SOHR_APK_ASSET" SOHR.apk update.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create sohr-latest "$SOHR_APK_ASSET" SOHR.apk update.json \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SOHR Latest" \
              --notes "Автоматический канал обновлений SOHR." \
              --prerelease
          fi


      - name: Verify published updater channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf verify-release
          mkdir verify-release
          cd verify-release

          gh release download sohr-latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "update.json" \
            --pattern "$SOHR_APK_ASSET"

          TEST_CODE="$(python3 -c 'import json; print(json.load(open("update.json"))["versionCode"])')"
          TEST_NAME="$(python3 -c 'import json; print(json.load(open("update.json"))["versionName"])')"
          TEST_URL="$(python3 -c 'import json; print(json.load(open("update.json"))["downloadUrl"])')"
          EXPECTED_SHA="$(python3 -c 'import json; print(json.load(open("update.json"))["sha256"])')"
          ACTUAL_SHA="$(sha256sum "$SOHR_APK_ASSET" | awk '{print $1}')"

          test "$TEST_CODE" = "$SOHR_BUILD_NUMBER"
          test "$TEST_NAME" = "$SOHR_VERSION_NAME"
          echo "$TEST_URL" | grep -Fq "/$SOHR_APK_ASSET"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"

          echo "Updater verified: $SOHR_VERSION_NAME ($SOHR_BUILD_NUMBER)"
          echo "Asset: $SOHR_APK_ASSET"
          echo "SHA-256: $ACTUAL_SHA"
