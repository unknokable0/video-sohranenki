name: Build Android APK

# SOHR 5.3 test channel: Twitch Device Code Flow
on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sohr-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      SOHR_KEYSTORE_B64: ${{ secrets.SOHR_KEYSTORE_B64 }}
      SOHR_KEYSTORE_PASSWORD: ${{ secrets.SOHR_KEYSTORE_PASSWORD }}
      SOHR_KEY_ALIAS: ${{ secrets.SOHR_KEY_ALIAS }}
      SOHR_KEY_PASSWORD: ${{ secrets.SOHR_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Assign SOHR 5.3.0-test15 version
        shell: bash
        run: |
          echo "SOHR_BUILD_NUMBER=503015" >> "$GITHUB_ENV"
          echo "SOHR_VERSION_NAME=5.3.0-test14" >> "$GITHUB_ENV"

      - name: Verify Twitch OAuth bridge
        shell: bash
        run: |
          CALLBACK="https://unknokable0.github.io/video-sohranenki/twitch-auth/"
          echo "Checking $CALLBACK"
          HTML="$(curl --silent --show-error --location --fail --max-time 20 "$CALLBACK")"
          printf '%s' "$HTML" | grep -q 'sohr://twitch-auth' || {
            echo "SOHR Twitch callback is not live or does not contain the app deep link." >&2
            exit 1
          }
          echo "SOHR Twitch callback is live"

      - name: Build installable APK
        shell: bash
        run: |
          if [ -n "$SOHR_KEYSTORE_B64" ]; then
            printf '%s' "$SOHR_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/native/sohr-release.jks"
            SOHR_KEYSTORE_PATH="$GITHUB_WORKSPACE/native/sohr-release.jks" SOHR_KEYSTORE_PASSWORD="$SOHR_KEYSTORE_PASSWORD" SOHR_KEY_ALIAS="$SOHR_KEY_ALIAS" SOHR_KEY_PASSWORD="$SOHR_KEY_PASSWORD" gradle -p native :app:assembleRelease --no-daemon --stacktrace
            cp native/app/build/outputs/apk/release/app-release.apk SOHR.apk
          else
            gradle -p native :app:assembleDebug --no-daemon --stacktrace
            cp native/app/build/outputs/apk/debug/app-debug.apk SOHR.apk
          fi
          APK_ASSET="SOHR-${SOHR_BUILD_NUMBER}.apk"
          cp SOHR.apk "$APK_ASSET"
          echo "SOHR_APK_ASSET=$APK_ASSET" >> "$GITHUB_ENV"

      - name: Generate updater manifest
        shell: bash
        run: |
          SHA256=$(sha256sum SOHR.apk | awk '{print $1}')
          cat > update.json <<EOF
          {
            "versionCode": $SOHR_BUILD_NUMBER,
            "versionName": "$SOHR_VERSION_NAME",
            "downloadUrl": "https://github.com/$GITHUB_REPOSITORY/releases/download/sohr-latest/$SOHR_APK_ASSET",
            "sha256": "$SHA256",
            "notes": "SOHR 5.3.0-test15 • restored Twitch implicit OAuth • direct return to SOHR • stable updater assets"
          }
          EOF
          cat update.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOHR-${{ github.run_number }}
          path: |
            SOHR.apk
            ${{ env.SOHR_APK_ASSET }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish updater channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view sohr-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload sohr-latest "$SOHR_APK_ASSET" SOHR.apk update.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create sohr-latest "$SOHR_APK_ASSET" SOHR.apk update.json \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SOHR Latest" \
              --notes "Автоматический канал обновлений SOHR." \
              --prerelease
          fi
